[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rova"
version = "0.1.0"
description = "ROVA backend — B2B pharmaceutical ordering platform for Mozambique"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "argon2-cffi>=23,<24",
  "PyJWT>=2.8,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
rova = "rova.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
