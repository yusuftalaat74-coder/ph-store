<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PH Store</title>
<style>
:root{
  --ground:#EFEDE8; --card:#FFFFFF; --ink:#16130F; --muted:#6C6559; --line:#E2DED6;
  --blue:#0A7AFF; --green:#17A34A; --teal:#0FA5A0; --orange:#F08222; --pink:#E8447A;
  --purple:#7B5CF0; --red:#E23B37;
  --r:18px; --pad:16px;
  --hero:linear-gradient(140deg,#25CC80,#0E9070 55%,#0A7C84);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ground);color:var(--ink);
  font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* ---------- chrome ---------- */
.sb{display:flex;justify-content:space-between;align-items:center;
    padding:10px var(--pad) 4px;font-size:13px;font-weight:700;flex:0 0 auto}
.sb .brand{letter-spacing:.2px}
.main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 var(--pad) 24px;
      -webkit-overflow-scrolling:touch}
h1{font-size:30px;line-height:1.1;margin:6px 0 2px;letter-spacing:-.6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}

.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);
        background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
        padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
               padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
.tabbar button.on{color:var(--green)}
.tabbar .ic{width:22px;height:22px;display:block}
.tabbar button:active{background:rgba(0,0,0,.05)}

/* ---------- blocks ---------- */
.card{background:var(--card);border-radius:var(--r);padding:var(--pad);margin-bottom:12px;
      box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.tap:active{transform:scale(.995);background:#FAF9F7}
.hero{background:var(--hero);color:#fff;border-radius:var(--r);padding:20px var(--pad);
      margin-bottom:14px}
.hero .k{font-size:13px;opacity:.9;font-weight:600}
.hero .v{font-size:32px;font-weight:800;letter-spacing:-1px;margin:2px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row+.row{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.t{font-weight:700}
.s{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.g{background:rgba(23,163,74,.12);color:var(--green)}
.pill.o{background:rgba(240,130,34,.14);color:#B45F10}
.pill.b{background:rgba(10,122,255,.12);color:var(--blue)}
.pill.r{background:rgba(226,59,55,.12);color:var(--red)}
.pill.m{background:rgba(108,101,89,.12);color:var(--muted)}

.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--ink);color:#fff;
     font-weight:700;text-align:center}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.4}
.btn.g{background:var(--green)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:9px 14px;width:auto;font-size:13px;border-radius:11px;display:inline-block}

input[type=text],input[type=password],input[type=number],input[type=search],textarea,select{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;
  background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--green)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
textarea{min-height:120px;resize:vertical}

.err{background:rgba(226,59,55,.1);color:#9B1D1A;border-radius:12px;padding:12px;
     font-size:13px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.ok{background:rgba(23,163,74,.1);color:#0C6B31;border-radius:12px;padding:12px;
    font-size:13px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);
      border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;
      vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:10px;background:var(--ground);
            font-weight:800;font-size:17px;line-height:1}
.qty span{min-width:26px;text-align:center;font-weight:700}

/* ---------- store ---------- */

/* The product grid. Two per row on a phone is what a thumb can hit; on a
   wider screen a fixed two columns stretched each tile to half the window,
   so the track is sized instead of counted and the row fills out on a
   tablet or a desktop browser. */
.grid{display:grid;gap:10px;margin-bottom:12px;
      grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.p{background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;
   box-shadow:0 1px 2px rgba(0,0,0,.04);position:relative;overflow:hidden}
.p .shot{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;
         display:flex;align-items:center;justify-content:center;margin-bottom:9px;
         overflow:hidden;background:var(--ground)}
.p .shot img{width:100%;height:100%;object-fit:contain}
.p .shot .mono{font-weight:800;font-size:26px;letter-spacing:-1px;color:#fff;opacity:.95}
.p .shot svg{position:absolute;right:8px;bottom:7px;width:20px;height:20px;opacity:.35;color:#fff}
.p .nm{font-weight:700;font-size:13px;line-height:1.3;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p .dt{color:var(--muted);font-size:11px;margin-top:2px;
       display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
/* Price and quantity share a line while they fit. On a narrow phone a long
   price plus a three-part counter does not fit, and the counter was being
   squeezed against the card edge — so the row wraps and the counter drops
   underneath, right-aligned, instead of overflowing. Costs no height in the
   common case, where the control is a single + circle. */
.p .foot{margin-top:auto;padding-top:9px;display:flex;align-items:flex-end;
         justify-content:space-between;gap:6px;flex-wrap:wrap;row-gap:8px}
.p .cnt{margin-inline-start:auto}
.p .pr{font-weight:800;font-size:15px;letter-spacing:-.3px;white-space:nowrap}
.was{color:var(--muted);font-size:11px;text-decoration:line-through;display:block}
.off{position:absolute;top:16px;left:16px;background:var(--red);color:#fff;
     font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;z-index:2}
.p .noff{color:var(--muted);font-size:11px;font-weight:600}

/* the circle the quantity is set from */
.rnd{width:30px;height:30px;min-width:30px;border-radius:50%;display:flex;
     align-items:center;justify-content:center;font-weight:800;font-size:17px;
     line-height:1;background:var(--green);color:#fff}
.rnd.o{background:var(--ground);color:var(--ink)}
.rnd:active{transform:scale(.92)}
.cnt{display:flex;align-items:center;gap:6px}
.cnt .n{min-width:18px;text-align:center;font-weight:800;font-size:14px}
.shelf{background:#fff;border-radius:14px;padding:12px;text-align:start;
       box-shadow:0 1px 2px rgba(0,0,0,.04);min-height:74px;
       display:flex;flex-direction:column;justify-content:space-between}
.shelf .n{font-weight:700;font-size:13px;line-height:1.25}
.shelf .c{color:var(--muted);font-size:12px;margin-top:6px}
.shelf:active{background:#FAF9F7}
.price{font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.from{color:var(--muted);font-size:11px;font-weight:600;display:block}
.cartbar{position:sticky;bottom:0;margin:4px calc(var(--pad) * -1) 0;
         padding:10px var(--pad) 12px;background:rgba(239,237,232,.94);
         backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}
.vendorline{display:flex;justify-content:space-between;align-items:center;gap:10px;
            padding:10px 0;border-top:1px solid var(--line)}
.best{background:rgba(23,163,74,.08);border-radius:10px;padding:10px;margin:0 -10px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}
.msg .w{display:block;font-size:11px;opacity:.75;margin-bottom:2px;font-weight:700}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.composer textarea{min-height:44px;max-height:120px}

.chip{display:inline-block;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);
      background:#fff;font-size:13px;font-weight:600;margin:0 6px 6px 0}
/* One line that scrolls sideways, so a long category list never pushes the
   products off the screen. */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;
       scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{margin:0;white-space:nowrap;flex:0 0 auto}
.chip .c{opacity:.55;font-weight:700;margin-inline-start:4px;font-size:11px}
.flabel{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 4px}
.chip.on{border-color:var(--green);background:rgba(23,163,74,.08);color:#0C6B31}
code{background:rgba(0,0,0,.05);padding:1px 5px;border-radius:5px;font-size:12px;
     font-family:ui-monospace,Menlo,monospace}

/* Latin text inside an Arabic line — a medicine name, a price, an id —
   keeps its own direction instead of being reordered around the
   punctuation around it. */
.bidi{unicode-bidi:isolate;direction:ltr;display:inline-block;text-align:start}
</style>
</head>

<div class="sb"><span id="clock">—</span><span class="brand">PH Store</span></div>
<div class="main" id="main"></div>

"use strict";
/* ===================================================================
   PH Store — the pharmacy client.

   Every screen below is backed by a real call to the PH Store API. There
   is no sample data in this file: if the server is unreachable the screen
   says so, in place, instead of rendering a number that came from nowhere.

   Five rules this file keeps:

   1. Money is never parsed into a JS number. The API sends 2dp strings
      (A2.4) and they are displayed as strings. A float here would quietly
      lose a metical over enough additions — the exact defect the backend
      was fixed for.
   2. A line the matcher did not resolve is never auto-picked. `ASK` lines
      render their candidates and wait; `UNRESOLVED` lines offer a search.
      This mirrors the server guard rather than working around it.
   3. Every render is wrapped. A thrown error paints the error into the
      screen instead of killing the handler — an earlier build of this app
      died on one null reference and every later tap silently did nothing,
      which looked exactly like "the app is just an image".
   4. The interface speaks English, Portuguese or Arabic. **A medicine name
      is never translated.** `Amoxicilina + Ácido Clavulânico` is what is
      printed on the box, on the invoice and in the national register; an
      Arabic or English rendering of it would be a different string from the
      one the pharmacist has to match against a physical package, and the
      matcher searches the Portuguese text regardless of the chosen
      interface language.
   5. A price shown next to a product is the cheapest *fresh* offer and it
      names the vendor. A storefront that shows a price without saying whose
      it is teaches the pharmacist to distrust it the first time two vendors
      disagree.
   =================================================================== */

/* ---------------- storage (never required) ---------------- */
const mem = {};
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v === null ? mem[k] : v; }
          catch(e){ return mem[k]; } },
  set(k,v){ mem[k] = v; try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------------- config ---------------- */
// Served from the API itself (http://host:8099/app) the API is this same
// origin, so there is nothing for the pharmacist to type. Loaded from
// file:///android_asset/ inside the APK there is no origin to borrow, so the
// Servidor field decides and this local default is only a first guess.
const DEFAULT_API = (location.protocol === "http:" || location.protocol === "https:")
  ? location.origin
  : "http://127.0.0.1:8099";
function apiBase(){ return (store.get("api") || DEFAULT_API).replace(/\/+$/,""); }

   English is the default because that is what was asked for; Portuguese is

function lang(){ const l = store.get("lang"); return T[l] ? l : "en"; }
function t(key){
  const L = T[lang()], E = T.en;
  return (L && L[key] !== undefined) ? L[key] : (E[key] !== undefined ? E[key] : key);
}
function tStatus(code){
  const L = T[lang()].st || {}, E = T.en.st;
  return L[code] || E[code] || code;
}
function applyLang(){
  // Arabic keeps the same left-to-right layout as Portuguese and English, by
  // decision: one arrangement of the screen for every language means a
  // pharmacist and a colleague on different settings point at the same place
  // on the same screen, and the tab order, the cart button and every price
  // column stay where the eye learned them. Only the words change. The
  // browser still shapes and orders Arabic runs correctly inside their own
  // paragraph, which is all that is needed here.
  document.documentElement.lang = lang();
  document.documentElement.dir = "ltr";

/* ---------------- api ---------------- */
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body !== undefined && !(opts.body instanceof FormData))
    headers["Content-Type"] = "application/json";
  if (S.token) headers["Authorization"] = "Bearer " + S.token;

  let res;
  try {
    res = await fetch(apiBase() + path, {
      method: opts.method || "GET",
      headers,
      body: opts.body === undefined ? undefined
            : (opts.body instanceof FormData ? opts.body : JSON.stringify(opts.body))
    });
  } catch (e) {
    throw new Error(t("no_connection") + "\n" + apiBase() + "\n\n" + e.message);
  }

  if (res.status === 204) return null;
  const txt = await res.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch(e){ data = { raw: txt }; }

  if (!res.ok){
    if (res.status === 401){ S.token = null; S.me = null; store.del("token"); }
    const err = (data && data.error) || {};
    const detail = (err.details || []).map(d => "· " + d.field + ": " + d.reason).join("\n");
    const e = new Error([err.message || ("HTTP " + res.status), detail].filter(Boolean).join("\n"));
    e.code = err.code; e.status = res.status; e.rule = err.rule;
    throw e;
  }
  return data;
}

/* ---------------- helpers ---------------- */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// money stays a string, start to finish
function MT(v){
  if (v === null || v === undefined) return "—";
  const s = String(v);
  const [i, d] = s.split(".");
  const grouped = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return grouped + "," + (d || "00") + " MT";
}

/* Rule 4. A product name is source data, not interface text: it is printed
   as it stands, and wrapped so that a Latin name inside an Arabic line keeps
   its own direction instead of being reordered around the punctuation. */
/* A money string is Latin digits plus a Latin unit. Dropped raw into an
   Arabic line it gets reordered — `0,00 MT` renders as `MT 0,00` — so it is
   isolated exactly like a product name. Rule 1 still holds: the value itself
   is never parsed, only wrapped. */
function money(v){ return '<span class="bidi">' + esc(MT(v)) + "</span>"; }

function name(p){
  const label = p.brand_name || p.inn || "—";
  const detail = [p.strength, p.form].filter(Boolean).join(" · ");
  return '<span class="bidi">' + esc(label) + "</span>" +
         (detail ? '<br><span class="s bidi">' + esc(detail) + "</span>" : "");
}
function plainName(p){
  return [p.brand_name || p.inn, p.strength, p.form].filter(Boolean).join(" · ");
}
const statusPill = st => {
  const cls = ({CLOSED:"m", CANCELLED:"m", REJECTED:"r", DISPUTED:"r",
                CONFIRMED:"g", ACCEPTED:"g", RECEIPT_ACCEPTED:"g",
                DISPATCHED:"b", IN_FULFILMENT:"b"})[st] || "o";
  return '<span class="pill ' + cls + '">' + esc(tStatus(st)) + "</span>";
};

/* ---------------- forms ----------------
   Every action runs through `guard`, and `guard` re-renders immediately to
   show the spinner. That rebuilds `#main`, which destroys the very inputs the
   action is about to read — so a login handler read two empty strings and the
   server answered 401 with correct credentials typed in front of you.

   Caught by the live end-to-end drive, not by reading the code. The fix is to
   snapshot the form the moment the tap happens, before anything re-renders,
   and have actions read the snapshot. `restoreForm` then puts the text back
   after a render so nothing the user typed is lost mid-request. */
S.form = {};

function snapshotForm(){
  const f = {};
  document.querySelectorAll("#main input, #main textarea, #main select")
    .forEach(el => { if (el.id) f[el.id] = el.value; });
  S.form = f;
}
function restoreForm(){
  document.querySelectorAll("#main input, #main textarea, #main select")
    .forEach(el => {
      if (el.id && S.form[el.id] !== undefined && !el.value) el.value = S.form[el.id];
    });
}
function val(id){
  if (S.form[id] !== undefined) return S.form[id];
  const el = document.getElementById(id);
  return el ? el.value : "";
}
function clearField(id){
  S.form[id] = "";
  const el = document.getElementById(id);
  if (el) el.value = "";
}

/* ---------------- render ---------------- */
function setBusy(v){ S.busy = v; render(); }

async function guard(fn){
  S.err = null;
  setBusy(true);
  try { await fn(); }
  catch (e) {
    S.err = e.message || String(e);
    // A refusal that names line ids is unreadable and, worse, unactionable:
    // the screen still shows the old prices, so the next tap sends the same
    // stale numbers and earns the same refusal. Reload the cart instead, so
    // the rows show what changed and the button becomes "continue at the new
    // prices". The reload must not mask the original refusal if it fails.
    if (e && e.code === "PRICE_MOVED") {
      // The reloaded cart raises its own "prices changed" banner and marks
      // the rows, so clearing this one avoids saying the same sentence twice.
      // If the reload fails the message stays, because then nothing else
      // will say it.
      S.err = t("prices_changed");
      try { await loadCart(); S.err = null; } catch (_) { /* keep the message */ }
    }
  }
  finally { setBusy(false); }
}

function render(){
  applyLang();
  const main = document.getElementById("main");
  if (!main) return;
  try {
    main.innerHTML =
      (S.err   ? '<div class="err">'  + esc(S.err)   + "</div>" : "") +
      (S.flash ? '<div class="ok">'   + esc(S.flash) + "</div>" : "") +
      (S.token ? VIEW[S.tab]() : loginView());
  } catch (e) {
    // rule 3: a broken screen still shows why, and the app stays alive
    main.innerHTML = '<div class="err">' + esc(t("draw_error")) + "\n" + esc(e.message) + "</div>";
  }
  restoreForm();
  renderTabs();
  if (S.scrollTo){
    const target = document.getElementById(S.scrollTo);
    S.scrollTo = null;
    if (target) target.scrollIntoView({ behavior:"smooth", block:"start" });

/* A product tile. No stock photo is invented: when `image_url` is empty the
   tile is drawn from the product's own name — two letters and a hue derived
   from the string, so the same medicine always looks the same and no two
   neighbours collide — with a capsule mark to say plainly that this stands
   in for a picture rather than being one. */
function hue(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}
const CAPSULE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round"><path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 ' +
  '7-7l7 7a5 5 0 0 1-7 7z"/><path d="M8.5 8.5 15.5 15.5"/></svg>';

function shot(p){
  if (p.image_url)
    return '<div class="shot"><img src="' + esc(p.image_url) + '" alt="" loading="lazy"></div>';
  const label = (p.brand_name || p.inn || "?").replace(/[^\p{L}\p{N}]/gu, "");
  const h = hue(label || "x");
  return '<div class="shot" style="background:linear-gradient(140deg,' +
    "hsl(" + h + ",62%,58%)," + "hsl(" + ((h + 38) % 360) + ",58%,44%))" + '">' +
    '<span class="mono">' + esc(label.slice(0, 2).toUpperCase()) + "</span>" +
    CAPSULE + "</div>";
}

/* The cart lives on the server now, so these read from the last response
   rather than from a local array. Nothing is guessed optimistically: a tap
   waits for the server and then the whole cart is replaced, which is what
   keeps two phones in the same pharmacy from drifting apart. */
function cartLines(){ return (S.cart && S.cart.lines) || []; }
function cartLineFor(productId){
  return cartLines().find(l => l.index_product_id === productId);
}
function cartCount(){ return cartLines().reduce((n, l) => n + l.qty_requested, 0); }

function qtyRound(p){
  const line = cartLineFor(p.id);
  // Disabled while a call is in flight. Two taps on `+` before the first
  // reply landed used to create two carts; the database now refuses the
  // second, but the pharmacist should not be tapping into a refusal either.
  const off = S.busy ? " disabled" : "";
  if (!line)
    return '<button class="rnd" data-act="add" data-id="' + esc(p.id) + '"' + off +
           ' aria-label="' + esc(t("add")) + '">+</button>';
  return '<span class="cnt">' +
    '<button class="rnd o" data-act="dec" data-id="' + esc(p.id) + '"' + off + ">−</button>" +
    '<span class="n">' + line.qty_requested + "</span>" +
    '<button class="rnd" data-act="inc" data-id="' + esc(p.id) + '"' + off + ">+</button>" +
  "</span>";
}

/* The two filter rows.

   They are separate questions on purpose: a pharmacist narrowing to
   `Comprimidos` wants every distributor's tablets, not one distributor's.
   So the category counts come from the whole catalogue and the two chips
   combine rather than one resetting the other.

   The counts are on the chips because a filter that leads to an empty
   screen wastes a tap on a phone in a shop. */
function filterBar(){
  const f = S.filters;
  if (!f) return "";
  const chip = (act, value, label, count, active) =>
    '<button class="chip bidi' + (active ? " on" : "") + '" data-act="' + act + '" ' +
    'data-value="' + esc(value) + '">' + esc(label) +
    (count === null || count === undefined ? "" : '<span class="c">' + count + "</span>") +
    "</button>";

  const vendors = f.vendors || [];
  const cats = f.categories || [];
  if (!vendors.length && !cats.length) return "";

  return (vendors.length > 1
    ? '<p class="s" style="margin:10px 0 4px">' + esc(t("distributor")) + "</p>" +
      '<div class="chips">' +
        chip("setVendor", "", t("all"), null, !S.vendor) +
        vendors.map(v => chip("setVendor", v.id, v.trade_name, v.product_count,
                              S.vendor === v.id)).join("") +
      "</div>"
    : "") +
    (cats.length
      ? '<p class="s" style="margin:6px 0 4px">' + esc(t("category")) + "</p>" +
        '<div class="chips">' +
          chip("setCategory", "", t("all"), null, !S.category) +
          cats.map(c => chip("setCategory", c.name, c.name, c.offered_count,
                             S.category === c.name)).join("") +
        "</div>"
      : "");
}

/* The price on a cart row. When the number moved while the cart was sitting,
   both are shown: the one the pharmacist remembers, struck through, and the
   one they would actually pay. Showing only the new number would be accurate
   and would still feel like a switch. */
function priceLine(l){
  if (l.price_now === null || l.price_now === undefined)
    return '<span class="s">' + esc(t("no_offer_line")) + "</span>";
  const now = '<span class="price">' + esc(MT(l.price_now)) + "</span>";
  if (l.price_state !== "UP" && l.price_state !== "DOWN") return now;
  return '<span class="was bidi">' + esc(t("was") + " " + MT(l.price_seen)) + "</span>" +
         now + ' <span class="s">' +
         esc(l.price_state === "UP" ? t("price_up") : t("price_down")) + "</span>";
}

  '<div style="height:12px"></div>' +

        esc(t("lines_left")) + "</button>") +

const VIEW = { store:storeView, cart:storeView, list:listView, orders:ordersView,
               chat:chatView, panel:panelView };

/* ---------------- loaders ---------------- */
async function loadFilters(){
  const [f, counts] = await Promise.all([
    api("/v1/catalogue/filters"),
    api("/v1/catalogue/shelves")   // carries the catalogue totals for the hero
  ]);
  S.filters = Object.assign({}, f, {
    catalogue_size: counts.catalogue_size,
    products_with_offers: counts.products_with_offers
  });
}

/* One query for all three narrowings. Search, distributor and category are
   the same question asked with more or fewer words, so they go to the same
   endpoint rather than to three code paths that could disagree. */
async function loadProducts(reset){
  const off = reset ? 0 : (S.nextOffset || 0);
  const p = new URLSearchParams({ limit: "30", offset: String(off), in_stock: "true" });
  if ((S.search || "").trim()) p.set("q", S.search.trim());
  if (S.vendor) p.set("vendor_id", S.vendor);
  if (S.category) p.set("category", S.category);
  const out = await api("/v1/catalogue/search?" + p.toString());
  S.results = reset ? out.items : (S.results || []).concat(out.items);
  S.nextOffset = out.next_offset;
}
async function loadHome(){ S.assistant = await api("/v1/assistant/summary"); }
/* `include_cart=false`: the cart is a DRAFT request, and without this it
   shows up in the order history as a draft the pharmacist never sent. */
async function loadOrders(){
  S.requests = (await api("/v1/requests?limit=50&include_cart=false")).items;
}
async function loadThread(){ S.thread = await api("/v1/support/threads/me"); }
async function loadCart(){ S.cart = await api("/v1/cart"); }

async function afterLogin(){
  S.me = await api("/v1/auth/me");
  await Promise.all([loadFilters(), loadCart()]);
  await loadProducts(true);
}

/* ---------------- actions ---------------- */
const ACT = {
  async setLang(el){
    store.set("lang", el.dataset.lang);
    applyLang();
  },
  async login(){
    const phone = val("ph");
    const pw = val("pw");
    const apiVal = val("api");
    if (apiVal) store.set("api", apiVal.trim());
    const out = await api("/v1/auth/login", {
      method:"POST", body:{ phone: phone.trim(), password: pw, surface:"PH" }
    });
    S.token = out.access_token;
    store.set("token", S.token);
    store.set("lastPhone", phone.trim());
    await afterLogin();
    S.tab = "store";
  },
  async saveApi(){
    const v = val("api").trim();
    if (v) store.set("api", v);
    S.flash = t("server_saved");
  },
  async ping(){
    const r = await fetch(apiBase() + "/healthz");
    const j = await r.json();
    S.flash = t("server_ok") + " · " + (j.status || "?");
  },
  async logout(){
    S.token = null; S.me = null; store.del("token");
    S.cart = null; S.results = null; S.requests = null; S.thread = null;
    S.assistant = null; S.norm = null; S.order = null;
    S.filters = null; S.vendor = ""; S.category = "";
    S.product = null; S.form = {};
  },

  /* ---- store ---- */
  async search(){
    S.search = val("q");
    S.product = null;
    await loadProducts(true);
  },
  async setVendor(el){
    S.vendor = el.dataset.value;
    S.product = null;
    await loadProducts(true);
  },
  async setCategory(el){
    S.category = el.dataset.value;
    S.product = null;
    await loadProducts(true);
  },
  async more(){
    if (S.nextOffset === null || S.nextOffset === undefined) return;
    await loadProducts(false);
  },
  async openProduct(el){
    S.product = await api("/v1/catalogue/products/" + el.dataset.id);
  },
  async closeProduct(){ S.product = null; },
  async goCart(){ S.tab = "cart"; S.product = null; await loadCart(); },
  async goStore(){ S.tab = "store"; },

  /* Every cart action sends the quantity the screen is showing, and the
     server answers with the whole cart. A retry after a dropped connection
     therefore lands on the same number instead of doubling it, and nothing
     is guessed locally. */
  async setQty(productId, qty){
    if (qty <= 0){
      const line = cartLineFor(productId);
      if (!line) return;
      await api("/v1/request-lines/" + line.id, { method:"DELETE" });
      await loadCart();
      return;
    }
    // The price this screen is showing goes with the line, and that number
    // -- not one the server works out a moment later -- is what checkout
    // holds us to. The grid prices by cheapest fresh offer while the cart
    // prices through the ranking engine, which also drops suspended vendors
    // and prefers one that can cover the quantity, so the two can differ.
    // When they do, the pharmacist sees "was X, now Y" instead of quietly
    // being charged Y.
    // The open product page first, the grid second. The detail page shows the
    // ranked price from its own offer list, the grid shows the cheapest fresh
    // offer; taking the grid's number while he is looking at the detail page
    // would make the cart announce a change he never saw. The product
    // endpoint carries no `best_price`, so its own top offer is the number
    // that was on that screen.
    let seen = null;
    if (S.product && S.product.id === productId) {
      const best = (S.product.offers || [])[0];
      seen = best ? best.price : null;
    } else {
      const card = (S.results || []).find(x => x.id === productId);
      seen = card ? card.best_price : null;
    }
    const line = { index_product_id: productId, qty_requested: qty };
    if (seen) line.price_seen = String(seen);
    S.cart = await api("/v1/cart/lines", { method:"POST", body:{ lines:[line] } });
  },
  async add(el){ await ACT.setQty(el.dataset.id, 1); },
  async inc(el){
    const line = cartLineFor(el.dataset.id);
    await ACT.setQty(el.dataset.id, (line ? line.qty_requested : 0) + 1);
  },
  async dec(el){
    const line = cartLineFor(el.dataset.id);
    await ACT.setQty(el.dataset.id, (line ? line.qty_requested : 1) - 1);
  },

  async incLine(el){
    const line = cartLines().find(l => l.id === el.dataset.line);
    if (!line) return;
    S.cart = await api("/v1/request-lines/" + line.id, {
      method:"PATCH", body:{ qty_requested: line.qty_requested + 1 } });
  },
  async decLine(el){
    const line = cartLines().find(l => l.id === el.dataset.line);
    if (!line) return;
    if (line.qty_requested <= 1) return ACT.dropCartLine(el);
    S.cart = await api("/v1/request-lines/" + line.id, {
      method:"PATCH", body:{ qty_requested: line.qty_requested - 1 } });
  },
  async dropCartLine(el){
    await api("/v1/request-lines/" + el.dataset.line, { method:"DELETE" });
    await loadCart();
  },

  async checkout(){
    const c = S.cart;
    if (!c || !cartLines().length) throw new Error(t("empty_cart"));
    // Rule: the server is told what the screen was showing, and refuses if
    // the two disagree. Sending `price_now` is exactly that — it is the
    // number rendered in the row the pharmacist is looking at.
    const acknowledged = {};
    cartLines().forEach(l => { if (l.price_now) acknowledged[l.id] = l.price_now; });
    const out = await api("/v1/requests/" + c.request_id + "/checkout", {
      method:"POST", headers:{ "Idempotency-Key": "co-" + c.request_id },
      body:{ acknowledged_prices: acknowledged }
    });
    const total = (out.orders || []).map(o => MT(o.goods_total)).join(" + ");
    S.flash = t("order_made") + " " + (out.orders || []).length + " " +
              t("order_count") + " · " + total;
    await loadCart();
    await loadOrders();
    S.tab = "orders";
  },

  /* ---- list ---- */
  async paste(){
    const body = val("paste");
    if (!body.trim()) throw new Error(t("write_a_line"));
    const out = await api("/v1/intake/text", {
      method:"POST", body:{ body: body, channel:"WHATSAPP_TEXT" }
    });
    S.lastRequestId = out.id;
    S.norm = await api("/v1/intake/" + out.id);
    S.scrollTo = "normblock";   // the block lands below the fold otherwise
    clearField("paste");
  },
  async resolve(el){
    await api("/v1/request-lines/" + el.dataset.line + "/resolve", {
      method:"POST", body:{ index_product_id: el.dataset.prod }
    });
    S.norm = await api("/v1/intake/" + S.lastRequestId);
    S.scrollTo = "normblock";
  },
  async dropline(el){
    await api("/v1/request-lines/" + el.dataset.line, { method:"DELETE" });
    S.norm = await api("/v1/intake/" + S.lastRequestId);
    S.scrollTo = "normblock";
  },
  async normdone(){
    await api("/v1/requests/" + S.lastRequestId + "/normalization-complete", { method:"POST" });
    await api("/v1/requests/" + S.lastRequestId + "/confirm", { method:"POST" });
    // the intake lane can buy now: confirmed is a valid checkout entry state
    const out = await api("/v1/requests/" + S.lastRequestId + "/checkout", {
      method:"POST", headers:{ "Idempotency-Key": "co-" + S.lastRequestId }, body:{}
    });
    const total = (out.orders || []).map(o => MT(o.goods_total)).join(" + ");
    S.flash = t("list_confirmed") + " " + (out.orders || []).length + " " +
              t("order_count") + " · " + total;
    S.norm = null;
    await loadOrders();
    S.tab = "orders";
  },

  /* ---- orders ---- */
  async reloadOrders(){ await loadOrders(); },
  async openReq(el){ S.order = await api("/v1/requests/" + el.dataset.id); },
  async backOrders(){ S.order = null; },

  /* ---- chat ---- */
  async send(){
    const body = val("msg").trim();
    if (!body) throw new Error(t("write_message"));
    await api("/v1/support/threads/me/messages", { method:"POST", body:{ body: body, channel:"APP" } });
    clearField("msg");
    await loadThread();
  },
  async escalate(){
    await api("/v1/support/threads/me/escalate", { method:"POST" });
    await loadThread();
  },

  /* ---- account ---- */
  async ask(){
    const q = val("ask").trim();
    if (!q) throw new Error(t("write_question"));
    S.askResult = await api("/v1/assistant/ask", { method:"POST", body:{ question: q } });
  }
};

/* ---------------- events ---------------- */
document.addEventListener("click", function(ev){
  const tabBtn = ev.target.closest && ev.target.closest("[data-tab]");
  if (tabBtn){
    S.tab = tabBtn.dataset.tab;
    S.err = null; S.flash = null; S.order = null; S.product = null;
    render();
    if (S.tab === "cart") guard(loadCart);
    if (S.tab === "store"  && S.filters  === null) guard(loadFilters);
    if (S.tab === "orders" && S.requests === null) guard(loadOrders);
    if (S.tab === "chat"   && S.thread   === null) guard(loadThread);
    if (S.tab === "panel"  && S.assistant=== null) guard(loadHome);
    return;
  }
  const el = ev.target.closest && ev.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  ev.preventDefault();
  snapshotForm();          // before guard() re-renders and destroys the inputs
  S.flash = null;
  guard(() => fn(el));
});

document.addEventListener("keydown", function(ev){
  if (ev.key !== "Enter") return;
  const el = ev.target;
  if (!el || el.tagName !== "INPUT") return;
  const act = el.id === "q" ? "search" : el.id === "ask" ? "ask"
            : (el.id === "ph" || el.id === "pw") ? "login" : null;
  if (!act) return;
  ev.preventDefault();
  snapshotForm();
  S.flash = null;
  guard(() => ACT[act](el));
});

/* ---------------- boot ---------------- */
function tick(){
  const c = document.getElementById("clock");
  if (c){
    const d = new Date();
    c.textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }
}
tick(); setInterval(tick, 20000);

applyLang();
render();
if (S.token) guard(afterLogin);
</script>
</body>
</html>
