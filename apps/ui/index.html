<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PH Store</title>
<style>
:root{
  --ground:#EFEDE8; --card:#FFFFFF; --ink:#16130F; --muted:#6C6559; --line:#E2DED6;
  --blue:#0A7AFF; --green:#17A34A; --teal:#0FA5A0; --orange:#F08222; --pink:#E8447A;
  --purple:#7B5CF0; --red:#E23B37;
  --r:18px; --pad:16px;
  --hero:linear-gradient(140deg,#25CC80,#0E9070 55%,#0A7C84);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ground);color:var(--ink);
  font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* ---------- chrome ---------- */
.sb{display:flex;justify-content:space-between;align-items:center;
    padding:10px var(--pad) 4px;font-size:13px;font-weight:700;flex:0 0 auto}
.sb .brand{letter-spacing:.2px}
.main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 var(--pad) 24px;
      -webkit-overflow-scrolling:touch}
h1{font-size:30px;line-height:1.1;margin:6px 0 2px;letter-spacing:-.6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}

.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);
        background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
        padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
               padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
.tabbar button.on{color:var(--green)}
.tabbar .ic{width:22px;height:22px;display:block}
.tabbar button:active{background:rgba(0,0,0,.05)}

/* ---------- blocks ---------- */
.card{background:var(--card);border-radius:var(--r);padding:var(--pad);margin-bottom:12px;
      box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.tap:active{transform:scale(.995);background:#FAF9F7}
.hero{background:var(--hero);color:#fff;border-radius:var(--r);padding:20px var(--pad);
      margin-bottom:14px}
.hero .k{font-size:13px;opacity:.9;font-weight:600}
.hero .v{font-size:32px;font-weight:800;letter-spacing:-1px;margin:2px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row+.row{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.t{font-weight:700}
.s{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.g{background:rgba(23,163,74,.12);color:var(--green)}
.pill.o{background:rgba(240,130,34,.14);color:#B45F10}
.pill.b{background:rgba(10,122,255,.12);color:var(--blue)}
.pill.r{background:rgba(226,59,55,.12);color:var(--red)}
.pill.m{background:rgba(108,101,89,.12);color:var(--muted)}

.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--ink);color:#fff;
     font-weight:700;text-align:center}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.4}
.btn.g{background:var(--green)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:9px 14px;width:auto;font-size:13px;border-radius:11px;display:inline-block}

input[type=text],input[type=password],input[type=number],input[type=search],textarea,select{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;
  background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--green)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
textarea{min-height:120px;resize:vertical}

.err{background:rgba(226,59,55,.1);color:#9B1D1A;border-radius:12px;padding:12px;
     font-size:13px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.ok{background:rgba(23,163,74,.1);color:#0C6B31;border-radius:12px;padding:12px;
    font-size:13px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);
      border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;
      vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:10px;background:var(--ground);
            font-weight:800;font-size:17px;line-height:1}
.qty span{min-width:26px;text-align:center;font-weight:700}

/* ---------- store ---------- */

/* The product grid. Two per row on a phone is what a thumb can hit; on a
   wider screen a fixed two columns stretched each tile to half the window,
   so the track is sized instead of counted and the row fills out on a
   tablet or a desktop browser. */
.grid{display:grid;gap:10px;margin-bottom:12px;
      grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.p{background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;
   box-shadow:0 1px 2px rgba(0,0,0,.04);position:relative;overflow:hidden}
.p .shot{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;
         display:flex;align-items:center;justify-content:center;margin-bottom:9px;
         overflow:hidden;background:var(--ground)}
.p .shot img{width:100%;height:100%;object-fit:contain}
.p .shot .mono{font-weight:800;font-size:26px;letter-spacing:-1px;color:#fff;opacity:.95}
.p .shot svg{position:absolute;right:8px;bottom:7px;width:20px;height:20px;opacity:.35;color:#fff}
.p .nm{font-weight:700;font-size:13px;line-height:1.3;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p .dt{color:var(--muted);font-size:11px;margin-top:2px;
       display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
/* Price and quantity share a line while they fit. On a narrow phone a long
   price plus a three-part counter does not fit, and the counter was being
   squeezed against the card edge — so the row wraps and the counter drops
   underneath, right-aligned, instead of overflowing. Costs no height in the
   common case, where the control is a single + circle. */
.p .foot{margin-top:auto;padding-top:9px;display:flex;align-items:flex-end;
         justify-content:space-between;gap:6px;flex-wrap:wrap;row-gap:8px}
.p .cnt{margin-inline-start:auto}
.p .pr{font-weight:800;font-size:15px;letter-spacing:-.3px;white-space:nowrap}
.was{color:var(--muted);font-size:11px;text-decoration:line-through;display:block}
.off{position:absolute;top:16px;left:16px;background:var(--red);color:#fff;
     font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;z-index:2}
.p .noff{color:var(--muted);font-size:11px;font-weight:600}

/* the circle the quantity is set from */
.rnd{width:30px;height:30px;min-width:30px;border-radius:50%;display:flex;
     align-items:center;justify-content:center;font-weight:800;font-size:17px;
     line-height:1;background:var(--green);color:#fff}
.rnd.o{background:var(--ground);color:var(--ink)}
.rnd:active{transform:scale(.92)}
.cnt{display:flex;align-items:center;gap:6px}
.cnt .n{min-width:18px;text-align:center;font-weight:800;font-size:14px}
.shelf{background:#fff;border-radius:14px;padding:12px;text-align:start;
       box-shadow:0 1px 2px rgba(0,0,0,.04);min-height:74px;
       display:flex;flex-direction:column;justify-content:space-between}
.shelf .n{font-weight:700;font-size:13px;line-height:1.25}
.shelf .c{color:var(--muted);font-size:12px;margin-top:6px}
.shelf:active{background:#FAF9F7}
.price{font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.from{color:var(--muted);font-size:11px;font-weight:600;display:block}
.cartbar{position:sticky;bottom:0;margin:4px calc(var(--pad) * -1) 0;
         padding:10px var(--pad) 12px;background:rgba(239,237,232,.94);
         backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}
.vendorline{display:flex;justify-content:space-between;align-items:center;gap:10px;
            padding:10px 0;border-top:1px solid var(--line)}
.best{background:rgba(23,163,74,.08);border-radius:10px;padding:10px;margin:0 -10px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}
.msg .w{display:block;font-size:11px;opacity:.75;margin-bottom:2px;font-weight:700}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.composer textarea{min-height:44px;max-height:120px}

.chip{display:inline-block;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);
      background:#fff;font-size:13px;font-weight:600;margin:0 6px 6px 0}
/* One line that scrolls sideways, so a long category list never pushes the
   products off the screen. */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;
       scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{margin:0;white-space:nowrap;flex:0 0 auto}
.chip .c{opacity:.55;font-weight:700;margin-inline-start:4px;font-size:11px}
.flabel{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 4px}
.chip.on{border-color:var(--green);background:rgba(23,163,74,.08);color:#0C6B31}
.bell{position:relative;flex:0 0 auto;width:40px;height:40px;display:flex;align-items:center;
      justify-content:center;border-radius:12px;color:var(--ink)}
.bell svg{width:22px;height:22px}
.bell:active{background:rgba(0,0,0,.05)}
.bell .badge{position:absolute;top:3px;inset-inline-end:3px;min-width:16px;height:16px;padding:0 4px;
      border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:800;
      display:flex;align-items:center;justify-content:center}
.reminder{display:block;border:1.5px solid var(--green);background:rgba(23,163,74,.06)}
.shelf-h{font-weight:700;color:var(--ink);margin:14px 0 6px}
.shelf-note{margin:-4px 0 10px;opacity:.85}
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .p.mini{flex:0 0 150px;margin:0}
.p .paid{margin:2px 0 0}
.row.unread .t::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
      background:var(--green);margin-inline-end:6px;vertical-align:middle}
code{background:rgba(0,0,0,.05);padding:1px 5px;border-radius:5px;font-size:12px;
     font-family:ui-monospace,Menlo,monospace}

/* Latin text inside an Arabic line — a medicine name, a price, an id —
   keeps its own direction instead of being reordered around the
   punctuation around it. */
.bidi{unicode-bidi:isolate;direction:ltr;display:inline-block;text-align:start}
</style>
</head>

<div class="main" id="main"></div>

<script>
"use strict";
/* ===================================================================
   PH Store — the pharmacy client.

   Every screen below is backed by a real call to the PH Store API. There
   is no sample data in this file: if the server is unreachable the screen
   says so, in place, instead of rendering a number that came from nowhere.

   Five rules this file keeps:

   1. Money is never parsed into a JS number. The API sends 2dp strings
      (A2.4) and they are displayed as strings. A float here would quietly
      lose a metical over enough additions — the exact defect the backend
      was fixed for.
   2. A line the matcher did not resolve is never auto-picked. `ASK` lines
      render their candidates and wait; `UNRESOLVED` lines offer a search.
      This mirrors the server guard rather than working around it.
   3. Every render is wrapped. A thrown error paints the error into the
      screen instead of killing the handler — an earlier build of this app
      died on one null reference and every later tap silently did nothing,
      which looked exactly like "the app is just an image".
   4. The interface speaks English, Portuguese or Arabic. **A medicine name
      is never translated.** `Amoxicilina + Ácido Clavulânico` is what is
      printed on the box, on the invoice and in the national register; an
      Arabic or English rendering of it would be a different string from the
      one the pharmacist has to match against a physical package, and the
      matcher searches the Portuguese text regardless of the chosen
      interface language.
   5. A price shown next to a product is the cheapest *fresh* offer and it
      names the vendor. A storefront that shows a price without saying whose
      it is teaches the pharmacist to distrust it the first time two vendors
      disagree.
   =================================================================== */

/* ---------------- storage (never required) ---------------- */
const mem = {};
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v === null ? mem[k] : v; }
          catch(e){ return mem[k]; } },
  set(k,v){ mem[k] = v; try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------------- config ---------------- */
// Served from the API itself (http://host:8099/app) the API is this same
// origin, so there is nothing for the pharmacist to type. Loaded from
// file:///android_asset/ inside the APK there is no origin to borrow, so the
// Servidor field decides and this local default is only a first guess.
const DEFAULT_API = (location.protocol === "http:" || location.protocol === "https:")
  ? location.origin
  : "http://127.0.0.1:8099";
function apiBase(){ return (store.get("api") || DEFAULT_API).replace(/\/+$/,""); }

   English is the default because that is what was asked for; Portuguese is
   one tap away and is what a Maputo pharmacist will pick. Arabic flips the

function lang(){ const l = store.get("lang"); return T[l] ? l : "en"; }
function t(key){
  const L = T[lang()], E = T.en;
  return (L && L[key] !== undefined) ? L[key] : (E[key] !== undefined ? E[key] : key);
}
function tStatus(code){
  const L = T[lang()].st || {}, E = T.en.st;
  return L[code] || E[code] || code;
}
function applyLang(){
  // Arabic keeps the same left-to-right layout as Portuguese and English, by
  // decision: one arrangement of the screen for every language means a
  // pharmacist and a colleague on different settings point at the same place
  // on the same screen, and the tab order, the cart button and every price
  // column stay where the eye learned them. Only the words change. The
  // browser still shapes and orders Arabic runs correctly inside their own
  // paragraph, which is all that is needed here.
  document.documentElement.lang = lang();
  document.documentElement.dir = "ltr";
}

/* ---------------- api ---------------- */
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body !== undefined && !(opts.body instanceof FormData))
    headers["Content-Type"] = "application/json";
  if (S.token) headers["Authorization"] = "Bearer " + S.token;

  let res;
  try {
    res = await fetch(apiBase() + path, {
      method: opts.method || "GET",
      headers,
      body: opts.body === undefined ? undefined
            : (opts.body instanceof FormData ? opts.body : JSON.stringify(opts.body))
    });
  } catch (e) {
    throw new Error(t("no_connection") + "\n" + apiBase() + "\n\n" + e.message);
  }

  if (res.status === 204) return null;
  const txt = await res.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch(e){ data = { raw: txt }; }

  if (!res.ok){
    if (res.status === 401){ S.token = null; S.me = null; store.del("token"); }
    const err = (data && data.error) || {};
    const detail = (err.details || []).map(d => "· " + d.field + ": " + d.reason).join("\n");
    const e = new Error([err.message || ("HTTP " + res.status), detail].filter(Boolean).join("\n"));
    // The details travel structured as well as flattened into the message:
    // a screen that has to act on a refusal — "over the limit with Medis, by
    // this much" — cannot do it by parsing the sentence back apart.
    e.code = err.code; e.status = res.status; e.rule = err.rule;
    e.details = err.details || [];
    throw e;
  }
  return data;
}

/* ---------------- helpers ---------------- */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// money stays a string, start to finish
function MT(v){
  if (v === null || v === undefined) return "—";
  const s = String(v);
  const [i, d] = s.split(".");
  const grouped = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return grouped + "," + (d || "00") + " MT";
}

/* Rule 4. A product name is source data, not interface text: it is printed
   as it stands, and wrapped so that a Latin name inside an Arabic line keeps
   its own direction instead of being reordered around the punctuation. */
/* A money string is Latin digits plus a Latin unit. Dropped raw into an
   Arabic line it gets reordered — `0,00 MT` renders as `MT 0,00` — so it is
   isolated exactly like a product name. Rule 1 still holds: the value itself
   is never parsed, only wrapped. */
function money(v){ return '<span class="bidi">' + esc(MT(v)) + "</span>"; }

/* The rule for mixed text, so it is decided once rather than per screen:
   `sentence()` for anything with words in it, `.bidi` only for pure data —
   a price, a product name, an id, a date on its own. `.bidi` forces LTR,
   which is right for `1 044,00 MT` and wrong for `كان 1 044,00 MT`, where it
   puts the Arabic word on the left of the number.

   A run of text that resolves its own direction.

   The page layout is deliberately LTR in all three languages — that is the
   owner's instruction and it holds. But *inside* a label, a sentence has to
   be laid out in its own direction or the browser puts the full stop at the
   wrong end and drags any number or Latin word to the wrong side of the
   words around it: `سلتك لسه مستنية.` rendered as `.سلتك لسه مستنية`, and
   `2 صنف · ACARILBIAL` came out with the parts in the wrong order.

   `dir="auto"` takes the direction from the first strong character of the
   run, so the Arabic reads right and the Portuguese and English are
   untouched. It changes nothing about where the box sits on the screen. */
function sentence(str){ return '<span dir="auto">' + esc(str) + "</span>"; }

function name(p){
  const label = p.brand_name || p.inn || "—";
  const detail = [p.strength, p.form].filter(Boolean).join(" · ");
  return '<span class="bidi">' + esc(label) + "</span>" +
         (detail ? '<br><span class="s bidi">' + esc(detail) + "</span>" : "");
}
function plainName(p){
  return [p.brand_name || p.inn, p.strength, p.form].filter(Boolean).join(" · ");
}
const statusPill = st => {
  const cls = ({CLOSED:"m", CANCELLED:"m", REJECTED:"r", DISPUTED:"r",
                CONFIRMED:"g", ACCEPTED:"g", RECEIPT_ACCEPTED:"g",
                DISPATCHED:"b", IN_FULFILMENT:"b"})[st] || "o";
  return '<span class="pill ' + cls + '">' + esc(tStatus(st)) + "</span>";
};

/* ---------------- forms ----------------
   Every action runs through `guard`, and `guard` re-renders immediately to
   show the spinner. That rebuilds `#main`, which destroys the very inputs the
   action is about to read — so a login handler read two empty strings and the
   server answered 401 with correct credentials typed in front of you.

   Caught by the live end-to-end drive, not by reading the code. The fix is to
   snapshot the form the moment the tap happens, before anything re-renders,
   and have actions read the snapshot. `restoreForm` then puts the text back
   after a render so nothing the user typed is lost mid-request. */
S.form = {};

function snapshotForm(){
  const f = {};
  document.querySelectorAll("#main input, #main textarea, #main select")
    .forEach(el => { if (el.id) f[el.id] = el.value; });
  S.form = f;
}
function restoreForm(){
  document.querySelectorAll("#main input, #main textarea, #main select")
    .forEach(el => {
      if (el.id && S.form[el.id] !== undefined && !el.value) el.value = S.form[el.id];
    });
}
function val(id){
  if (S.form[id] !== undefined) return S.form[id];
  const el = document.getElementById(id);
  return el ? el.value : "";
}
function clearField(id){
  S.form[id] = "";
  const el = document.getElementById(id);
  if (el) el.value = "";
}

/* ---------------- render ---------------- */
function setBusy(v){ S.busy = v; render(); }

async function guard(fn){
  S.err = null;
  setBusy(true);
  try { await fn(); }
  catch (e) {
    S.err = e.message || String(e);
    // A refusal that names line ids is unreadable and, worse, unactionable:
    // the screen still shows the old prices, so the next tap sends the same
    // stale numbers and earns the same refusal. Reload the cart instead, so
    // the rows show what changed and the button becomes "continue at the new
    // prices". The reload must not mask the original refusal if it fails.
    // R-044: over the credit limit with one distributor. The server names
    // which, how much headroom is left and what the order comes to, so the
    // app can say something a pharmacist can act on instead of repeating
    // "credit limit exceeded" at him.
    if (e && e.rule === "R-044" && e.details) {
      const d = {};
      e.details.forEach(x => { d[x.field] = x.reason; });
      if (d.vendor_id) {
        const known = (S.cart && S.cart.totals.by_vendor || [])
          .concat(S.quote && S.quote.totals.by_vendor || [])
          .find(v => v.vendor_id === d.vendor_id);
        S.creditWall = { vendor_id: d.vendor_id,
                         vendor_name: known ? known.vendor_name : null,
                         headroom: d.headroom, order_value: d.order_value };
        S.err = null;
        try { await loadCreditAsk(); } catch (_) { /* the wall still shows */ }
      }
    }
    if (e && e.code === "PRICE_MOVED") {
      // Reload whichever screen is showing the prices — the basket, or the
      // pasted list's confirmation. Both then raise their own banner and
      // mark the rows that moved, so clearing this message avoids saying the
      // same sentence twice; if the reload fails it stays, because then
      // nothing else will say it.
      S.err = t("prices_changed");
      try {
        if (S.quote) {
          // A pasted list stores no `price_seen` — nothing displayed a price
          // when those lines were created — so the reloaded screen would come
          // back marked SAME and tell him nothing had changed, which is the
          // opposite of true. What this client displayed is the claim, so it
          // carries it across the reload itself.
          const wasShowing = {};
          (S.quote.lines || []).forEach(l => { wasShowing[l.id] = l.price_now; });
          const fresh = await api("/v1/requests/" + S.quote.request_id + "/priced");
          (fresh.lines || []).forEach(l => {
            const before = wasShowing[l.id];
            if (before == null || l.price_now == null) return;
            l.price_seen = before;
            l.price_state = Number(before) === Number(l.price_now) ? "SAME"
                          : Number(l.price_now) > Number(before) ? "UP" : "DOWN";
          });
          S.quote = fresh;
        } else {
          await loadCart();
        }
        S.err = null;
      } catch (_) { /* keep the message */ }
    }
  }
  finally { setBusy(false); }
}

function render(){
  applyLang();
  const main = document.getElementById("main");
  if (!main) return;
  try {
    main.innerHTML =
      // `sentence()`, not `esc()`: both banners routinely carry a count or an
      // amount inside a sentence, and an LTR box reorders the Arabic ones.
      (S.err   ? '<div class="err">'  + sentence(S.err)   + "</div>" : "") +
      (S.flash ? '<div class="ok">'   + sentence(S.flash) + "</div>" : "") +
      (S.token ? VIEW[S.tab]() : loginView());
  } catch (e) {
    // rule 3: a broken screen still shows why, and the app stays alive
    main.innerHTML = '<div class="err">' + sentence(t("draw_error")) + "\n" + esc(e.message) + "</div>";
  }
  restoreForm();
  renderTabs();
  if (S.scrollTo){
    const target = document.getElementById(S.scrollTo);
    S.scrollTo = null;
    if (target) target.scrollIntoView({ behavior:"smooth", block:"start" });
  }
}

/* A product tile. No stock photo is invented: when `image_url` is empty the
   tile is drawn from the product's own name — two letters and a hue derived
   from the string, so the same medicine always looks the same and no two
   neighbours collide — with a capsule mark to say plainly that this stands
   in for a picture rather than being one. */
function hue(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}
const CAPSULE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round"><path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 ' +
  '7-7l7 7a5 5 0 0 1-7 7z"/><path d="M8.5 8.5 15.5 15.5"/></svg>';

function shot(p){
  if (p.image_url)
    return '<div class="shot"><img src="' + esc(p.image_url) + '" alt="" loading="lazy"></div>';
  const label = (p.brand_name || p.inn || "?").replace(/[^\p{L}\p{N}]/gu, "");
  const h = hue(label || "x");
  return '<div class="shot" style="background:linear-gradient(140deg,' +
    "hsl(" + h + ",62%,58%)," + "hsl(" + ((h + 38) % 360) + ",58%,44%))" + '">' +
    '<span class="mono">' + esc(label.slice(0, 2).toUpperCase()) + "</span>" +
    CAPSULE + "</div>";
}

/* The cart lives on the server now, so these read from the last response
   rather than from a local array. Nothing is guessed optimistically: a tap
   waits for the server and then the whole cart is replaced, which is what
   keeps two phones in the same pharmacy from drifting apart. */
function cartLines(){ return (S.cart && S.cart.lines) || []; }
function cartLineFor(productId){
  return cartLines().find(l => l.index_product_id === productId);
}
/* Lines, not units. "4 items in your cart" has to mean the same thing on the
   bar, on the reminder and in the notice; the notice carries `line_count`,
   and the summary's `cart_lines` counts lines too. Summing quantities made
   three products at two each read as "6 items" on two screens and "3 items"
   on the third. */
function cartCount(){ return cartLines().length; }

/* Every card currently on screen, by product id — the grid and all four home
   shelves. One lookup, so a new shelf cannot quietly become a place where
   the price he saw is not recorded. */
function shownCard(productId){
  const pools = [S.results || []];
  if (S.shelves) ["usual", "cheaper", "best_off", "low"].forEach(k => pools.push(S.shelves[k] || []));
  for (const pool of pools) {
    const hit = pool.find(x => x && x.id === productId);
    if (hit) return hit;
  }
  return null;
}

function qtyRound(p){
  const line = cartLineFor(p.id);
  // Disabled while a call is in flight. Two taps on `+` before the first
  // reply landed used to create two carts; the database now refuses the
  // second, but the pharmacist should not be tapping into a refusal either.
  const off = S.busy ? " disabled" : "";
  if (!line)
    return '<button class="rnd" data-act="add" data-id="' + esc(p.id) + '"' + off +
           ' aria-label="' + esc(t("add")) + '">+</button>';
  return '<span class="cnt">' +
    '<button class="rnd o" data-act="dec" data-id="' + esc(p.id) + '"' + off + ">−</button>" +
    '<span class="n">' + line.qty_requested + "</span>" +
    '<button class="rnd" data-act="inc" data-id="' + esc(p.id) + '"' + off + ">+</button>" +
  "</span>";
}

function priceBlock(p){
  if (p.best_price)
    return "<span>" +
      (p.list_price && p.discount_pct ? '<span class="was">' + esc(MT(p.list_price)) + "</span>" : "") +
      '<span class="pr bidi">' + esc(MT(p.best_price)) + "</span></span>";
  if (p.regulated_price)
    return '<span class="noff">' + sentence(t("regulated")) + "</span>";
  return '<span class="noff">' + sentence(t("no_offer")) + "</span>";
}

function productCard(p){
  const detail = [p.strength, p.form].filter(Boolean).join(" · ");
  return '<div class="p">' +
    (p.discount_pct ? '<span class="off">-' + p.discount_pct + "%</span>" : "") +
    '<div data-act="openProduct" data-id="' + esc(p.id) + '">' +
      shot(p) +
      '<div class="nm bidi">' + esc(p.brand_name || p.inn || "—") + "</div>" +
      (detail ? '<div class="dt bidi">' + esc(detail) + "</div>" : "") +
    "</div>" +
    '<div class="foot">' + priceBlock(p) + qtyRound(p) + "</div>" +
  "</div>";
}

function cartBar(){
  const n = cartCount();
  if (!n) return "";
  return '<div class="cartbar">' +
    '<button class="btn g" data-act="goCart">' +
      sentence(t("cart") + " · " + n + " " + t("items")) + "</button></div>";
}

/* The two filter rows.

   They are separate questions on purpose: a pharmacist narrowing to
   `Comprimidos` wants every distributor's tablets, not one distributor's.
   So the category counts come from the whole catalogue and the two chips
   combine rather than one resetting the other.

   The counts are on the chips because a filter that leads to an empty
   screen wastes a tap on a phone in a shop. */
function filterBar(){
  const f = S.filters;
  if (!f) return "";
  const chip = (act, value, label, count, active) =>
    '<button class="chip bidi' + (active ? " on" : "") + '" data-act="' + act + '" ' +
    'data-value="' + esc(value) + '">' + esc(label) +
    (count === null || count === undefined ? "" : '<span class="c">' + count + "</span>") +
    "</button>";

  const vendors = f.vendors || [];
  const cats = f.categories || [];
  if (!vendors.length && !cats.length) return "";

  return (vendors.length > 1
    ? '<p class="s" style="margin:10px 0 4px">' + esc(t("distributor")) + "</p>" +
      '<div class="chips">' +
        chip("setVendor", "", t("all"), null, !S.vendor) +
        vendors.map(v => chip("setVendor", v.id, v.trade_name, v.product_count,
                              S.vendor === v.id)).join("") +
      "</div>"
    : "") +
    (cats.length
      ? '<p class="s" style="margin:6px 0 4px">' + esc(t("category")) + "</p>" +
        '<div class="chips">' +
          chip("setCategory", "", t("all"), null, !S.category) +
          cats.map(c => chip("setCategory", c.name, c.name, c.offered_count,
                             S.category === c.name)).join("") +
        "</div>"
      : "");
}

function storeView(){
  if (S.product) return productView();
  if (S.tab === "cart") return cartView();
  if (S.tab === "notifs") return notifView();
  const f = S.filters;
  const results = S.results;
  const filtered = !!(S.vendor || S.category || (S.search || "").trim());
  return '' +
  '<div class="row" style="margin:0 0 2px;padding:0;border:0;align-items:flex-start">' +
    "<h1 style='margin:0'>" + esc(t("store")) + "</h1>" +
    '<button class="bell" data-act="goNotifs" aria-label="' + esc(t("notifs")) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/>' +
      '<path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>' +
      (S.unread ? '<span class="badge">' + (S.unread > 9 ? "9+" : S.unread) + "</span>" : "") +
    "</button>" +
  "</div>" +
  '<p class="sub">' + sentence(t("store_sub")) + "</p>" +
  cartReminder() +
  '<div class="card">' +
    '<input id="q" type="search" placeholder="' + esc(t("search_ph")) + '" dir="ltr" ' +
      'value="' + esc(S.search) + '">' +
    '<div style="height:10px"></div>' +
    '<button class="btn" data-act="search"' + (S.busy ? " disabled" : "") + ">" +
      (S.busy ? '<span class="spin"></span>' : esc(t("search"))) + "</button>" +
  "</div>" +

  (f && !filtered
    ? '<div class="hero">' +
        '<div class="v">' + f.catalogue_size + "</div>" +
        '<div class="k">' + esc(t("catalogue_size")) + "</div>" +
        '<div class="k" style="margin-top:6px">' +
          sentence(f.products_with_offers + " " + t("with_offers")) + "</div>" +
      "</div>"
    : "") +

  filterBar() +
  (filtered ? "" : shelves()) +

  (results === null
    ? '<div class="card empty">' +
        (S.busy ? '<span class="spin"></span>' : esc(t("loading"))) + "</div>"
    : results.length === 0
      ? '<div class="card empty">' + sentence(t("nothing")) + "</div>"
      : '<div class="grid">' + results.map(productCard).join("") + "</div>" +
        (S.nextOffset !== null && S.nextOffset !== undefined
          ? '<button class="btn ghost" data-act="more">+</button>' : "")) +
  cartBar();
}

function productView(){
  const p = S.product;
  const offers = p.offers || [];
  return '' +
  '<button class="btn ghost sm" data-act="closeProduct">← ' + esc(t("back")) + "</button>" +
  '<div style="height:12px"></div>' +
  '<div class="card" style="padding:0;overflow:hidden">' +
    '<div style="max-width:260px;margin:0 auto;padding:16px">' + shot(p) + "</div>" +
  "</div>" +
  '<h1 class="bidi">' + esc(p.brand_name || p.inn) + "</h1>" +
  '<p class="sub bidi">' + esc([p.inn, p.strength, p.form, p.pack_size].filter(Boolean).join(" · ")) + "</p>" +

  '<div class="card">' +
    '<span class="t">' + esc(t("vendors")) + "</span>" +
    (offers.length === 0
      ? '<p class="s" style="margin:10px 0 0">' + sentence(t("no_offer")) + "</p>"
      : offers.map((o,i) =>
          '<div class="vendorline' + (i === 0 ? " best" : "") + '">' +
            "<span><span class='t bidi'>" + esc(o.vendor_name || o.vendor_id) + "</span>" +
            (i === 0 ? ' <span class="pill g">' + esc(t("best")) + "</span>" : "") +
            '<br><span class="s">' +
            sentence(o.qty_available + " " + t("stock") + " · " +
                     t("expires_in") + " " + o.expiry_horizon_days + " " + t("days")) +
            "</span></span>" +
            "<span style='text-align:end'>" +
              (o.discount_pct ? '<span class="pill r" style="margin-bottom:3px;display:inline-block">-' +
                                o.discount_pct + "%</span><br>" : "") +
              (o.list_price && o.discount_pct
                ? '<span class="was">' + esc(MT(o.list_price)) + "</span>" : "") +
              '<span class="price">' + money(o.price) + "</span>" +
            "</span>" +
          "</div>").join("")) +
    (p.single_candidate ? '<p class="s" style="margin:10px 0 0">' +
        sentence(t("single_vendor")) + "</p>" : "") +
  "</div>" +

  '<div class="card">' +
    '<div class="row" style="margin:0;padding:0;border:0">' +
      '<span class="t">' + esc(t("in_cart")) + "</span>" + qtyRound(p) +
    "</div>" +
  "</div>" +

}

/* The price on a cart row. When the number moved while the cart was sitting,
   both are shown: the one the pharmacist remembers, struck through, and the
   one they would actually pay. Showing only the new number would be accurate
   and would still feel like a switch. */
function priceLine(l){
  if (l.price_now === null || l.price_now === undefined)
    return '<span class="s">' + sentence(t("no_offer_line")) + "</span>";
  const now = '<span class="price">' + esc(MT(l.price_now)) + "</span>";
  if (l.price_state !== "UP" && l.price_state !== "DOWN") return now;
  return '<span class="was">' + sentence(t("was") + " " + MT(l.price_seen)) + "</span>" +
         now + ' <span class="s">' +
         sentence(l.price_state === "UP" ? t("price_up") : t("price_down")) + "</span>";
}

/* ---------------- notices ---------------- */

/* The line at the top of the store when a basket has been sitting.

   Not shown for a cart he touched today: the floating bar at the bottom
   already says how many items are in it, and repeating that as a "reminder"
   on every visit teaches him to ignore reminders. What this adds is the
   part he has forgotten — how long it has been there, and what it comes to.
*/
function cartReminder(){
  const c = S.cart;
  const lines = cartLines();
  if (!lines.length || !c || !c.last_touched_at) return "";
  // `idle` comes from the server, computed from the same CFG-CART-IDLE-HOURS
  // the reminder job reads. Deciding it here on the phone's calendar day
  // meant a basket forty minutes old got a "since yesterday" line at
  // midnight, while one sitting twenty-three hours got nothing.
  if (!c.idle) return "";
  const touched = new Date(c.last_touched_at);
  if (isNaN(touched)) return "";
  const when = dayLabel(c.last_touched_at);
  // One sentence, resolved in its own direction, then the numbers on their
  // own line. Mixing "2 items in your cart since" with an Arabic date inside
  // one LTR line is what scrambled it.
  return '<button class="card tap reminder" data-act="goCart" style="width:100%;text-align:start">' +
    '<span class="t">' +
      sentence(cartCount() + " " + t("items") + " " + t("cart_waiting") + " " + when) +
    "</span>" +
    '<br><span class="s bidi">' + esc(MT(c.totals.goods_total)) + "</span>" +
  "</button>";
}

/* What a notice says, in the pharmacist's language.

   Every code this app knows how to phrase gets a sentence; anything else
   falls back to the code itself rather than rendering nothing. A notice
   that arrives from a part of the system this screen has not been taught
   about should still be visible — an empty row would look like a bug, and
   an invisible one would hide something that mattered.
*/
function noticeText(n){
  const p = n.payload || {};
  if (n.event_code === "N-CART-IDLE") {
    const items = (p.first_items || []).join(" · ");
    // A notice is about one basket. The server marks it read the moment that
    // basket is ordered or abandoned, but a row already on this screen can
    // still be stale, and sending him to "the cart" would open a different
    // one — or an empty one — with no hint that anything had changed.
    const current = S.cart && S.cart.request_id === p.request_id;
    const when = p.last_touched_at ? dayLabel(p.last_touched_at) : null;
    return { title: t("cart_idle_notice"),
             body: (p.line_count || 0) + " " + t("items") +
                   (when ? " · " + when : "") + (items ? " · " + items : ""),
             act: current ? "goCart" : null,
             cta: current ? t("open_cart") : null };
  }
  return { title: t("notice"), body: n.event_code, act: null, cta: null };
}

/* A date a pharmacist reads, in his own language, with the same digits as
   the rest of the sentence — `ar-EG` alone renders Arabic-Indic numerals
   next to the ASCII ones the counts use. */
function dayLabel(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const loc = lang() === "ar" ? "ar-EG-u-nu-latn" : lang();
  return d.toLocaleDateString(loc, { weekday: "long", day: "numeric", month: "short" });
}

function notifView(){
  const rows = S.notifs;
  return '' +
  '<button class="btn ghost sm" data-act="goStore">← ' + esc(t("back")) + "</button>" +
  '<div style="height:12px"></div>' +
  "<h1>" + esc(t("notifs")) + "</h1>" +
  (rows === null
    ? '<div class="card empty">' +
        (S.busy ? '<span class="spin"></span>' : esc(t("loading"))) + "</div>"
    : rows.length === 0
      ? '<div class="card empty">' + sentence(t("no_notifs")) + "</div>"
      : (S.unread
          ? '<button class="chip" data-act="readAll">' + esc(t("mark_all_read")) + "</button>" +
            '<div style="height:10px"></div>'
          : "") +
        '<div class="card">' +
          rows.map(n => {
            const x = noticeText(n);
            const unread = !n.read_at;
            return '<div class="row' + (unread ? " unread" : "") + '" ' +
              'data-act="readNotice" data-id="' + esc(n.id) + '">' +
              "<span><span class='t'>" + sentence(x.title) + "</span>" +
                '<br><span class="s">' + sentence(x.body) + "</span></span>" +
              (x.cta ? '<span class="chip">' + esc(x.cta) + "</span>" : "") +
            "</div>";
          }).join("") +
        "</div>") +
  cartBar();
}

/* A shelf: a title and a row of cards that scrolls sideways.

   Deliberately the same card as the grid, shrunk — picture, name, price,
   discount, the same quantity dial. A second card design would be a second
   place for the price to be wrong, and the whole point of these rows is
   that he can add from them without going anywhere. */
function shelf(key, items, extra){
  if (!items || !items.length) return "";
  return '<p class="s shelf-h">' + esc(t(key)) + "</p>" +
    '<div class="rail">' +
      items.map(p => '<div class="p mini">' +
        (p.discount_pct ? '<span class="off">-' + p.discount_pct + "%</span>" : "") +
        '<div data-act="openProduct" data-id="' + esc(p.id) + '">' +
          shot(p) +
          '<div class="nm bidi">' + esc(p.brand_name || p.inn || "—") + "</div>" +
        "</div>" +
        (extra ? extra(p) : "") +
        '<div class="foot">' + priceBlock(p) + qtyRound(p) + "</div>" +
      "</div>").join("") +
    "</div>";
}

/* The three shelves, plus the one that only exists for a pharmacy with a
   linked stock system. Shown on the unfiltered store only: once he has
   searched or picked a distributor, the screen is answering a question and
   these are not part of the answer. */
function shelves(){
  const sh = S.shelves;
  if (!sh) return "";
  return shelf("usual", sh.usual) +
    // "paid 331, now 290" is a sentence with two amounts in it, so it goes
    // through `sentence()` and not `.bidi`
    shelf("cheaper", sh.cheaper, p => '<div class="s paid">' +
      sentence(t("you_paid") + " " + MT(p.paid) +
               (p.paid_when ? " (" + dayLabel(p.paid_when) + ")" : "") +
               " · " + t("now_at") + " " + MT(p.best_price)) +
      "</div>") +
    // The caveat travels with the shelf it qualifies: the comparison is
    // against today's offers, not the ones live when he ordered, and
    // regulated medicines are out of it entirely. Both come from the
    // endpoint, and the Portuguese note is shown as it was written.
    (sh.cheaper.length && sh.caveat
      ? '<p class="s shelf-note bidi">' + esc(sh.caveat) + "</p>" : "") +
    (sh.cheaper.length && sh.regulated_note
      ? '<p class="s shelf-note bidi">' + esc(sh.regulated_note) + "</p>" : "") +
    shelf("best_off", sh.best_off) +
    shelf("running_low", sh.low);
}

/* The credit limit, and the two ways past it.

   R-044 used to be the end of the conversation: "credit limit exceeded",
   with a full basket and nothing to press. There are two honest answers and
   the app should offer both. Paying cash needs nobody's permission — the
   facility is bypassed, so there is no limit to exceed. Asking needs
   somebody with the standing to say yes: the distributor's order desk,
   admin or accounts, or PH Store's own. Either side may answer, and
   whichever did is recorded on the order.

   Nothing here decides anything itself. The server refuses or allows; this
   screen only stops the refusal from being a wall. */
function creditBlock(){
  const w = S.creditWall;
  if (!w) return "";
  const ask = S.creditAsk;
  const vendorName = w.vendor_name || w.vendor_id;
  return '<div class="card" id="creditblock" style="border:1.5px solid var(--red)">' +
    '<span class="t">' + sentence(t("credit_wall") + " " + vendorName) + "</span>" +
    '<div class="row"><span class="s">' + esc(t("credit_order_value")) + "</span>" +
      '<span class="price">' + money(w.order_value) + "</span></div>" +
    // A negative "remaining" is a puzzle at a counter. The account is
    // already past its limit, so say that, with the amount as a positive
    // number he can read.
    (Number(w.headroom) < 0
      ? '<div class="row"><span class="s">' + esc(t("credit_over_by")) + "</span>" +
          '<span class="bidi">' + esc(MT(String(Math.abs(Number(w.headroom)).toFixed(2)))) +
        "</span></div>"
      : '<div class="row"><span class="s">' + esc(t("credit_headroom")) + "</span>" +
          '<span class="bidi">' + esc(MT(w.headroom)) + "</span></div>") +
    (ask
      ? '<p class="s" style="margin:12px 0 0">' +
          sentence(ask.status === "APPROVED" ? t("credit_approved")
                 : ask.status === "DECLINED" ? t("credit_declined")
                 : t("credit_pending")) +
          (ask.decision_reason ? ' <span class="bidi">· ' + esc(ask.decision_reason) + "</span>" : "") +
        "</p>"
      : '<div style="height:10px"></div>' +
        '<input id="creditnote" type="text" placeholder="' + esc(t("credit_note_ph")) + '">' +
        '<div style="height:10px"></div>' +
        '<button class="btn" data-act="askCredit"' + (S.busy ? " disabled" : "") + ">" +
          (S.busy ? '<span class="spin"></span>' : esc(t("ask_credit"))) + "</button>") +
    '<div style="height:8px"></div>' +
    '<button class="btn ghost" data-act="payCash"' + (S.busy ? " disabled" : "") + ">" +
      esc(t("pay_cash")) + "</button>" +
  "</div>";
}

function cartView(){
  const c = S.cart;
  const lines = cartLines();
  const blocked = (c && c.checkout_blocked_by) || [];

      '<div class="card">' +

          '<div class="row">' +
            "<span>" + name(l) +
              (l.vendor_name ? '<br><span class="s bidi">' + esc(l.vendor_name) + "</span>" : "") +
              "<br>" + priceLine(l) +
            "</span>" +
            '<span style="text-align:end">' +
              '<span class="cnt">' +
                '<button class="rnd o" data-act="decLine" data-line="' + esc(l.id) + '">−</button>' +
                '<span class="n">' + l.qty_requested + "</span>" +
                '<button class="rnd" data-act="incLine" data-line="' + esc(l.id) + '">+</button>' +
              "</span>" +
              '<br><button class="chip" data-act="dropCartLine" data-line="' + esc(l.id) + '" ' +
                'style="margin-top:6px">' + esc(t("remove")) + "</button>" +
            "</span>" +
          "</div>").join("") +
        '<div class="row"><span class="t">' + esc(t("goods")) + "</span>" +
          '<span class="price">' + money(c.totals.goods_total) + "</span></div>" +
        '<div style="height:14px"></div>' +
        '<button class="btn g" data-act="checkout"' +
          ((S.busy || blocked.length) ? " disabled" : "") + ">" +

}

/* ---------------- list (the WhatsApp paste) ---------------- */
function listView(){
  return '' +
  "<h1>" + esc(t("list_title")) + "</h1>" +
  '<p class="sub">' + sentence(t("list_sub")) + "</p>" +

/* The pasted list, priced, before a metical moves.

   This is the screen the WhatsApp lane did not have. It used to go
   "confirm" -> `checkout` in one tap, so a pharmacist could place an order
   at prices he had never been shown — the exact thing the basket was sent
   back twice to prevent, on the lane where it matters more, because he
   pastes a list he wrote for a person and does not expect it to become a

/* ---------------- loaders ---------------- */
async function loadFilters(){
  const [f, counts] = await Promise.all([
    api("/v1/catalogue/filters"),
    api("/v1/catalogue/shelves")   // carries the catalogue totals for the hero
  ]);
  S.filters = Object.assign({}, f, {
    catalogue_size: counts.catalogue_size,
    products_with_offers: counts.products_with_offers
  });
}

/* One query for all three narrowings. Search, distributor and category are
   the same question asked with more or fewer words, so they go to the same
   endpoint rather than to three code paths that could disagree. */
async function loadProducts(reset){
  const off = reset ? 0 : (S.nextOffset || 0);
  const p = new URLSearchParams({ limit: "30", offset: String(off), in_stock: "true" });
  if ((S.search || "").trim()) p.set("q", S.search.trim());
  if (S.vendor) p.set("vendor_id", S.vendor);
  if (S.category) p.set("category", S.category);
  const out = await api("/v1/catalogue/search?" + p.toString());
  S.results = reset ? out.items : (S.results || []).concat(out.items);
  S.nextOffset = out.next_offset;
}
async function loadHome(){ S.assistant = await api("/v1/assistant/summary"); }

/* The home shelves.

   Each one is his own data or it is not shown. "What you usually buy" and
   "cheaper now than you paid" come from this pharmacy's own orders;
   "biggest discount" is the vendor's own published price against what the
   pharmacy pays; "running low" needs a linked pharmacy system and returns
   nothing without one. None of them is padded, and a shelf with nothing
   honest to put on it is left out rather than filled with a guess — the
   pilot pharmacies have an order or two, so two of these will stay hidden
   for weeks, and that is right rather than a fault.

   One load per session, like the filters. Four calls plus one to turn ids
   into cards is not something to pay for on every tap. */
async function loadShelves(){
  // One burst, however many taps arrive while it is in flight. Without this
  // a tap on the store tab during the first load ran five more calls with
  // every `+` disabled until they came back.
  if (S.shelvesLoading) return;
  S.shelvesLoading = true;
  // The token this load belongs to. It is fired un-awaited from `afterLogin`,
  // so a logout while it is in flight would otherwise land the previous
  // person's shelves on the next person's screen — the same class of thing
  // the inbox was fixed for, on a phone two people share.
  const forToken = S.token;
  try {
    const out = await _loadShelves();
    if (S.token === forToken) S.shelves = out;
  } finally { S.shelvesLoading = false; }
}

async function _loadShelves(){
  const out = emptyShelves();
  const [patterns, savings, discounted, replen] = await Promise.all([
    api("/v1/assistant/order-patterns").catch(() => null),
    api("/v1/assistant/savings").catch(() => null),
    api("/v1/catalogue/search?sort=discount&in_stock=true&limit=12").catch(() => null),
    api("/v1/assistant/replenishment").catch(() => null),
  ]);

  out.best_off = (discounted && discounted.items) || [];
  out.caveat = (savings && savings.basis && savings.basis.caveat) || null;
  out.regulated_note = (savings && savings.regulated_note_pt) || null;

  // The sprint's rule, kept where it can be read: below three orders there
  // is no pattern, only a coincidence, and a shelf that says "what you
  // usually buy" about one purchase is a lie with a friendly face.
  const hasPattern = patterns && patterns.items && patterns.items.length &&
                     patterns.confidence !== "NONE" && patterns.confidence !== "LOW";

  // One entry per product, at the price he paid most recently — the server
  // decides that now. Picking the highest here was the wrong number and
  // could not be made right from this side: the endpoint emits a line only
  // where today's best beats that line's own price, so the purchase that
  // contradicts the card is the one the client never receives.
  const paidBy = {};
  ((savings && savings.items) || []).forEach(i => {
    paidBy[i.index_product_id] = { paid: i.unit_price_paid, when: i.ordered_at };
  });
  const savingIds = Object.keys(paidBy).slice(0, 12);

  // "Running low" is a shelf of products, and the endpoint answers in
  // dispensing rows — ids, rates and days of cover, with no name, picture or
  // price on them. They have to become cards like everything else. The
  // threshold exists because the endpoint returns the whole dispensed range
  // sorted by cover: without it a linked pharmacy would see every product it
  // has ever sold under "running low", a year of stock included.
  //
  // It is a constant here and it should not stay one. This page ships inside
  // an APK, so changing 21 means a release, while a `CFG-REPLENISH-DAYS` row
  // — or a `max_days_of_cover` parameter defaulting from one — changes
  // without one. No pharmacy is linked yet, so moving it now would be
  // guessing at a number for a shelf nobody can see; move it with the first
  // `pms_link`.
  const lowIds = ((replen && replen.items) || [])
    .filter(i => i.estimated_days_of_cover !== null && i.estimated_days_of_cover <= 21)
    .slice(0, 12)
    .map(i => i.index_product_id);

  const wanted = [];
  if (hasPattern) patterns.items.slice(0, 12).forEach(i => wanted.push(i.index_product_id));
  savingIds.forEach(id => wanted.push(id));
  lowIds.forEach(id => wanted.push(id));

  if (wanted.length) {
    const cards = (await api("/v1/catalogue/search?limit=100&ids=" +
                             encodeURIComponent([...new Set(wanted)].join(","))
                            ).catch(() => ({ items: [] }))).items || [];
    const byId = {};
    cards.forEach(c => { byId[c.id] = c; });
    // the caller's order, not the catalogue's: how often he reorders
    // something is not a property of the product
    if (hasPattern)
      out.usual = patterns.items.map(i => byId[i.index_product_id]).filter(Boolean);
    out.cheaper = savingIds.map(id => {
      const card = byId[id];
      return card ? Object.assign({}, card, { paid: paidBy[id].paid,
                                              paid_when: paidBy[id].when }) : null;
    }).filter(Boolean);
    out.low = lowIds.map(id => byId[id]).filter(Boolean);
  }
  return out;
}

function emptyShelves(){ return { usual: [], cheaper: [], best_off: [], low: [], caveat: null,
                                  regulated_note: null }; }

/* Redraw, unless he is in the middle of something.

   `render()` rebuilds the whole of `#main`, and the search box and the
   WhatsApp paste box are not state-bound — so a late arrival used to wipe a
   list he was halfway through typing, two to ten seconds after he started.
   It also used to shove the grid down by four rails while he was reading it.
   Deferring to the next tap costs nothing: every tap re-renders anyway. */
function renderIfIdle(){
  const el = document.activeElement;
  const typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
  if (typing || S.tab !== "store" || S.busy) return;
  render();
}

/* Whether a permission is already in flight for this basket and this
   distributor, and what came back if it has been answered. */
async function loadCreditAsk(){
  const w = S.creditWall;
  const rid = (S.quote && S.quote.request_id) || (S.cart && S.cart.request_id);
  if (!w || !rid) { S.creditAsk = null; return; }
  const list = (await api("/v1/credit-overrides?limit=20")).items || [];
  S.creditAsk = list.find(o => o.request_id === rid && o.vendor_id === w.vendor_id) || null;
}

async function loadUnread(){
  // Its own call, and a cheap one: the badge has to be right on every screen,
  // and pulling the whole inbox to count it would be paid for on every load.
  try { S.unread = (await api("/v1/notifications/unread-count")).unread || 0; }
  catch (e) { S.unread = 0; }   // a badge is not worth failing a screen over
}
async function loadNotifications(){
  S.notifs = (await api("/v1/notifications?limit=30")).items;
  await loadUnread();
}
/* `include_cart=false`: the cart is a DRAFT request, and without this it
   shows up in the order history as a draft the pharmacist never sent. */
async function loadOrders(){
  S.requests = (await api("/v1/requests?limit=50&include_cart=false")).items;
}
async function loadThread(){ S.thread = await api("/v1/support/threads/me"); }
async function loadCart(){ S.cart = await api("/v1/cart"); }

async function afterLogin(){
  S.me = await api("/v1/auth/me");
  await Promise.all([loadFilters(), loadCart(), loadUnread()]);
  await loadProducts(true);
  // After the grid, not with it: the shelves are five more calls and the
  // pharmacist should be looking at products before they land.
  loadShelves().catch(() => { S.shelves = emptyShelves(); }).then(renderIfIdle);
}

/* ---------------- actions ---------------- */
const ACT = {
  async setLang(el){
    store.set("lang", el.dataset.lang);
    applyLang();
  },
  async login(){
    const phone = val("ph");
    const pw = val("pw");
    const apiVal = val("api");
    if (apiVal) store.set("api", apiVal.trim());
    const out = await api("/v1/auth/login", {
      method:"POST", body:{ phone: phone.trim(), password: pw, surface:"PH" }
    });
    S.token = out.access_token;
    store.set("token", S.token);
    store.set("lastPhone", phone.trim());
    await afterLogin();
    S.tab = "store";
  },
  async saveApi(){
    const v = val("api").trim();
    if (v) store.set("api", v);
    S.flash = t("server_saved");
  },
  async ping(){
    const r = await fetch(apiBase() + "/healthz");
    const j = await r.json();
    S.flash = t("server_ok") + " · " + (j.status || "?");
  },
  async logout(){
    S.token = null; S.me = null; store.del("token");
    S.cart = null; S.results = null; S.requests = null; S.thread = null;
    S.assistant = null; S.norm = null; S.quote = null; S.order = null;
    S.creditWall = null; S.creditAsk = null;
    // The inbox too: on a shared counter phone the next person tapped the
    // bell and saw the last person's notices until the call came back.
    S.notifs = null; S.unread = 0;
    S.filters = null; S.shelves = null; S.vendor = ""; S.category = "";
    S.product = null; S.form = {};
  },

  /* ---- store ---- */
  async search(){
    S.search = val("q");
    S.product = null;
    await loadProducts(true);
  },
  async setVendor(el){
    S.vendor = el.dataset.value;
    S.product = null;
    await loadProducts(true);
  },
  async setCategory(el){
    S.category = el.dataset.value;
    S.product = null;
    await loadProducts(true);
  },
  async more(){
    if (S.nextOffset === null || S.nextOffset === undefined) return;
    await loadProducts(false);
  },
  async openProduct(el){
    S.product = await api("/v1/catalogue/products/" + el.dataset.id);
  },
  async closeProduct(){ S.product = null; },
  async goNotifs(){
    S.tab = "notifs";
    await loadNotifications();
  },
  async readNotice(el){
    const n = (S.notifs || []).find(x => x.id === el.dataset.id);
    if (!n) return;
    if (!n.read_at) {
      await api("/v1/notifications/" + n.id + "/read", { method:"POST" });
      n.read_at = "now";
      // The count, before going anywhere. Leaving on the tap without it left
      // the badge showing a notice he had just read, on every screen, until
      // something else happened to reload it.
      await loadUnread();
    }
    // Read first, then act: tapping a notice about a basket should open the
    // basket, not leave him on a list to find it himself.
    if (noticeText(n).act === "goCart") return ACT.goCart();
  },
  async readAll(){
    await api("/v1/notifications/read-all", { method:"POST" });
    await loadNotifications();
  },
  async askCredit(){
    const w = S.creditWall;
    const rid = (S.quote && S.quote.request_id) || (S.cart && S.cart.request_id);
    if (!w || !rid) return;
    S.creditAsk = await api("/v1/requests/" + rid + "/credit-override", {
      method:"POST", body:{ vendor_id: w.vendor_id, note: val("creditnote") || null }
    });
    clearField("creditnote");
    S.flash = t("credit_ask_sent");
  },
  async payCash(){
    // The door that needs nobody: the facility is bypassed for this
    // distributor, so there is no limit left to exceed. It is a real
    // decision about how he pays, so it is his tap and not a fallback the
    // app takes on his behalf.
    const w = S.creditWall;
    const rid = (S.quote && S.quote.request_id) || (S.cart && S.cart.request_id);
    if (!w || !rid) return;
    const overrides = {}; overrides[w.vendor_id] = "UPFRONT";
    const lines = ((S.quote && S.quote.lines) || cartLines());
    const acknowledged = {};
    lines.forEach(l => { if (l.price_now) acknowledged[l.id] = l.price_now; });
    if (S.quote && S.quote.status === "AWAITING_CONFIRMATION")
      await api("/v1/requests/" + rid + "/confirm", { method:"POST" });
    const out = await api("/v1/requests/" + rid + "/checkout", {
      method:"POST", headers:{ "Idempotency-Key": "co-cash-" + rid },
      body:{ acknowledged_prices: acknowledged, payment_overrides: overrides }
    });
    const total = (out.orders || []).map(o => MT(o.goods_total)).join(" + ");
    S.flash = t("order_made") + " " + (out.orders || []).length + " " +
              t("order_count") + " · " + total;
    S.creditWall = null; S.creditAsk = null; S.quote = null;
    await loadCart();
    await loadOrders();
    S.tab = "orders";
  },
  async goCart(){ S.tab = "cart"; S.product = null; await loadCart(); },
  async goStore(){ S.tab = "store"; },

  /* Every cart action sends the quantity the screen is showing, and the
     server answers with the whole cart. A retry after a dropped connection
     therefore lands on the same number instead of doubling it, and nothing
     is guessed locally. */
  async setQty(productId, qty){
    if (qty <= 0){
      const line = cartLineFor(productId);
      if (!line) return;
      await api("/v1/request-lines/" + line.id, { method:"DELETE" });
      await loadCart();
      return;
    }
    // The price this screen is showing goes with the line, and that number
    // -- not one the server works out a moment later -- is what checkout
    // holds us to. The grid prices by cheapest fresh offer while the cart
    // prices through the ranking engine, which also drops suspended vendors
    // and prefers one that can cover the quantity, so the two can differ.
    // When they do, the pharmacist sees "was X, now Y" instead of quietly
    // being charged Y.
    // The price on the screen he tapped, wherever that screen was.
    //
    // The open product page first: it shows the ranked price from its own
    // offer list, and taking the grid's number while he is looking at it
    // would make the cart announce a change he never saw. Then the grid, then
    // the home shelves — which is the case this missed. A shelf card is
    // almost never in the grid (the grid is the first thirty of three
    // thousand by name; the discount shelf is the top twelve by margin), so
    // `+` on a shelf sent no claim at all and the server stored its own
    // price as if it were the one he had been shown. That is precisely the
    // defect this mechanism exists to prevent, arriving through a new door.
    let seen = null;
    if (S.product && S.product.id === productId) {
      const best = (S.product.offers || [])[0];
      seen = best ? best.price : null;
    } else {
      const card = shownCard(productId);
      seen = card ? card.best_price : null;
    }
    const line = { index_product_id: productId, qty_requested: qty };
    if (seen) line.price_seen = String(seen);
    S.cart = await api("/v1/cart/lines", { method:"POST", body:{ lines:[line] } });
  },
  async add(el){ await ACT.setQty(el.dataset.id, 1); },
  async inc(el){
    const line = cartLineFor(el.dataset.id);
    await ACT.setQty(el.dataset.id, (line ? line.qty_requested : 0) + 1);
  },
  async dec(el){
    const line = cartLineFor(el.dataset.id);
    await ACT.setQty(el.dataset.id, (line ? line.qty_requested : 1) - 1);
  },

  async incLine(el){
    const line = cartLines().find(l => l.id === el.dataset.line);
    if (!line) return;
    S.cart = await api("/v1/request-lines/" + line.id, {
      method:"PATCH", body:{ qty_requested: line.qty_requested + 1 } });
  },
  async decLine(el){
    const line = cartLines().find(l => l.id === el.dataset.line);
    if (!line) return;
    if (line.qty_requested <= 1) return ACT.dropCartLine(el);
    S.cart = await api("/v1/request-lines/" + line.id, {
      method:"PATCH", body:{ qty_requested: line.qty_requested - 1 } });
  },
  async dropCartLine(el){
    await api("/v1/request-lines/" + el.dataset.line, { method:"DELETE" });
    await loadCart();
  },

  async checkout(){
    S.creditWall = null;
    const c = S.cart;
    if (!c || !cartLines().length) throw new Error(t("empty_cart"));
    // Rule: the server is told what the screen was showing, and refuses if
    // the two disagree. Sending `price_now` is exactly that — it is the
    // number rendered in the row the pharmacist is looking at.
    const acknowledged = {};
    cartLines().forEach(l => { if (l.price_now) acknowledged[l.id] = l.price_now; });
    const out = await api("/v1/requests/" + c.request_id + "/checkout", {
      method:"POST", headers:{ "Idempotency-Key": "co-" + c.request_id },
      body:{ acknowledged_prices: acknowledged }
    });
    const total = (out.orders || []).map(o => MT(o.goods_total)).join(" + ");
    // Held as one string and rendered through `sentence()` where the flash is
    // drawn: "تم الطلب: 1 طلب · 1 069,00 MT" has words, a count and an amount
    // in one line, which is exactly what an LTR box reorders.
    S.flash = t("order_made") + " " + (out.orders || []).length + " " +
              t("order_count") + " · " + total;
    await loadCart();
    await loadOrders();
    S.tab = "orders";
  },

  /* ---- list ---- */
  async paste(){
    const body = val("paste");
    if (!body.trim()) throw new Error(t("write_a_line"));
    const out = await api("/v1/intake/text", {
      method:"POST", body:{ body: body, channel:"WHATSAPP_TEXT" }
    });
    S.lastRequestId = out.id;
    S.norm = await api("/v1/intake/" + out.id);
    S.scrollTo = "normblock";   // the block lands below the fold otherwise
    clearField("paste");
  },
  async resolve(el){
    await api("/v1/request-lines/" + el.dataset.line + "/resolve", {
      method:"POST", body:{ index_product_id: el.dataset.prod }
    });
    S.norm = await api("/v1/intake/" + S.lastRequestId);
    S.scrollTo = "normblock";
  },
  async dropline(el){
    await api("/v1/request-lines/" + el.dataset.line, { method:"DELETE" });
    S.norm = await api("/v1/intake/" + S.lastRequestId);
    S.scrollTo = "normblock";
  },
  async normdone(){
    // Settling what he meant, and then showing what it costs. Confirming is
    // deliberately NOT done here: SM-01 says a line can only be dropped
    // before `CONFIRM`, so a price screen shown after it would be a dead end
    // for a line nobody can supply — he would be looking at a blocked basket
    // with no way to unblock it. `CONFIRM` is the pharmacist agreeing, and
    // he should be agreeing to a number.
    await api("/v1/requests/" + S.lastRequestId + "/normalization-complete", { method:"POST" });
    S.quote = await api("/v1/requests/" + S.lastRequestId + "/priced");
    S.norm = null;
    S.scrollTo = "quoteblock";
  },
  async quoteCancel(){
    // Back to deciding what the list meant. `REQUEST_CHANGES` is SM-01's own
    // way back from AWAITING_CONFIRMATION, so the request is left where the
    // normalisation screen can edit it rather than stranded one state along.
    const rid = S.quote.request_id;
    if (S.quote.status === "AWAITING_CONFIRMATION")
      await api("/v1/requests/" + rid + "/request-changes", { method:"POST" }).catch(() => {});
    S.quote = null;
    S.norm = await api("/v1/intake/" + rid).catch(() => null);
    S.scrollTo = "normblock";
  },
  async dropQuoteLine(el){
    // Still AWAITING_CONFIRMATION, so a line nobody can supply can still be
    // taken out — which is the whole reason the prices are shown before the
    // confirmation rather than after it.
    await api("/v1/request-lines/" + el.dataset.line, { method:"DELETE" });
    S.quote = await api("/v1/requests/" + S.quote.request_id + "/priced");
    S.scrollTo = "quoteblock";
  },
  async quoteAccept(){
    S.creditWall = null;
    const q = S.quote;
    // The prices on this screen, sent back as the claim — the same
    // mechanism the basket uses, so the server refuses if any of them is
    // not what it is about to bill.
    const acknowledged = {};
    (q.lines || []).forEach(l => { if (l.price_now) acknowledged[l.id] = l.price_now; });
    // His agreement, in one act: the SM-01 CONFIRM and the purchase at the
    // prices on this screen.
    if (q.status === "AWAITING_CONFIRMATION")
      await api("/v1/requests/" + q.request_id + "/confirm", { method:"POST" });
    const out = await api("/v1/requests/" + q.request_id + "/checkout", {
      method:"POST", headers:{ "Idempotency-Key": "co-" + q.request_id },
      body:{ acknowledged_prices: acknowledged }
    });
    const total = (out.orders || []).map(o => MT(o.goods_total)).join(" + ");
    S.flash = t("list_confirmed") + " " + (out.orders || []).length + " " +
              t("order_count") + " · " + total;
    S.quote = null;
    await loadOrders();
    S.tab = "orders";
  },

  /* ---- orders ---- */
  async reloadOrders(){ await loadOrders(); },
  async openReq(el){ S.order = await api("/v1/requests/" + el.dataset.id); },
  async reorder(){
    const o = S.order;
    const all = (o.lines || []).length;
    // Only lines that resolved to a product. A WhatsApp line nobody decided
    // has no product to add, and inventing one would be the app choosing a
    // medicine on his behalf.
    const lines = (o.lines || [])
      .filter(l => l.index_product_id)
      .map(l => ({ index_product_id: l.index_product_id,
                   qty_requested: l.qty_requested }));
    if (!lines.length) throw new Error(t("nothing_to_reorder"));
    // One call, not one per line: this is a single act. Nothing is bought —
    // it goes into the basket and he looks at it, which is the rule for
    // every card on this screen too.
    S.cart = await api("/v1/cart/lines", { method:"POST", body:{ lines: lines } });
    S.order = null;
    S.tab = "cart";
    // Say what happened. Dropping two of nine and reporting "added to your
    // cart" is the app deciding what he meant; the products it could not add
    // are the ones he is most likely to go looking for.
    const missing = (all - lines.length) + ((S.cart.skipped || []).length);
    S.flash = missing
      ? t("reorder_partial").replace("{n}", all - missing).replace("{all}", all)
      : t("reorder_done");
  },
  async backOrders(){ S.order = null; },

  /* ---- chat ---- */
  async send(){
    const body = val("msg").trim();
    if (!body) throw new Error(t("write_message"));
    await api("/v1/support/threads/me/messages", { method:"POST", body:{ body: body, channel:"APP" } });
    clearField("msg");
    await loadThread();
  },
  async escalate(){
    await api("/v1/support/threads/me/escalate", { method:"POST" });
    await loadThread();
  },

  /* ---- account ---- */
  async ask(){
    const q = val("ask").trim();
    if (!q) throw new Error(t("write_question"));
    S.askResult = await api("/v1/assistant/ask", { method:"POST", body:{ question: q } });
  }
};

/* ---------------- events ---------------- */
document.addEventListener("click", function(ev){
  const tabBtn = ev.target.closest && ev.target.closest("[data-tab]");
  if (tabBtn){
    S.tab = tabBtn.dataset.tab;
    S.err = null; S.flash = null; S.order = null; S.product = null;
    render();
    if (S.tab === "cart") guard(loadCart);
    if (S.tab === "store"  && S.filters  === null) guard(loadFilters);
    if (S.tab === "store"  && S.shelves  === null && !S.shelvesLoading) guard(loadShelves);
    if (S.tab === "orders" && S.requests === null) guard(loadOrders);
    if (S.tab === "chat"   && S.thread   === null) guard(loadThread);
    if (S.tab === "panel"  && S.assistant=== null) guard(loadHome);
    return;
  }
  const el = ev.target.closest && ev.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  ev.preventDefault();
  snapshotForm();          // before guard() re-renders and destroys the inputs
  S.flash = null;
  guard(() => fn(el));
});

/* Coming back to the app is the moment to re-read what the server has.

   The sprint asks for it in those words, and in the APK it is the only
   moment that exists: the page is a WebView that is never reloaded, so a
   notice written while the phone was in somebody's pocket, or a basket a
   colleague edited from the back office, would otherwise appear only after
   a cold start. The cart goes with it because the two are the same fact —
   the reminder line at the top of the store is drawn from `GET /v1/cart`.

   Failures are swallowed on purpose: this fires on every tab switch and on
   every unlock, and a red banner because the shop's connection dropped for
   a second is worse than a slightly stale badge. */
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState !== "visible" || !S.token) return;
  Promise.all([loadCart().catch(() => {}), loadUnread().catch(() => {})])
    .then(() => { if (S.tab === "notifs") return loadNotifications().catch(() => {}); })
    .then(render);
});

document.addEventListener("keydown", function(ev){
  if (ev.key !== "Enter") return;
  const el = ev.target;
  if (!el || el.tagName !== "INPUT") return;
  const act = el.id === "q" ? "search" : el.id === "ask" ? "ask"
            : (el.id === "ph" || el.id === "pw") ? "login" : null;
  if (!act) return;
  ev.preventDefault();
  snapshotForm();
  S.flash = null;
  guard(() => ACT[act](el));
});

/* ---------------- boot ---------------- */
function tick(){
  const c = document.getElementById("clock");
  if (c){
    const d = new Date();
    c.textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }
}
tick(); setInterval(tick, 20000);

applyLang();
render();
if (S.token) guard(afterLogin);
</script>
</body>
</html>
