  async goCart(){ S.tab = "cart"; S.product = null; await loadCart(); },
  async goStore(){ if (S.isReviewer) return ACT.goPending(); S.tab = "store"; },

  /* Every cart action sends the quantity the screen is showing, and the
     server answers with the whole cart. A retry after a dropped connection
     therefore lands on the same number instead of doubling it, and nothing
     is guessed locally. */
  async setQty(productId, qty){
    if (qty <= 0){
      const line = cartLineFor(productId);
      if (!line) return;
      await api("/v1/request-lines/" + line.id, { method:"DELETE" });
      await loadCart();
      return;
    }
    // The price this screen is showing goes with the line, and that number
    // -- not one the server works out a moment later -- is what checkout
    // holds us to. The grid prices by cheapest fresh offer while the cart
    // prices through the ranking engine, which also drops suspended vendors
    // and prefers one that can cover the quantity, so the two can differ.
    // When they do, the pharmacist sees "was X, now Y" instead of quietly
    // being charged Y.
    // The price on the screen he tapped, wherever that screen was.
    //
    // The open product page first: it shows the ranked price from its own
    // offer list, and taking the grid's number while he is looking at it
    // would make the cart announce a change he never saw. Then the grid, then
    // the home shelves — which is the case this missed. A shelf card is
    // almost never in the grid (the grid is the first thirty of three
    // thousand by name; the discount shelf is the top twelve by margin), so
    // `+` on a shelf sent no claim at all and the server stored its own
    // price as if it were the one he had been shown. That is precisely the
    // defect this mechanism exists to prevent, arriving through a new door.
    let seen = null;
    if (S.product && S.product.id === productId) {
      const best = (S.product.offers || [])[0];
      seen = best ? best.price : null;
    } else {
      const card = shownCard(productId);
      seen = card ? card.best_price : null;
    }
    const line = { index_product_id: productId, qty_requested: qty };
    if (seen) line.price_seen = String(seen);
    S.cart = await api("/v1/cart/lines", { method:"POST", body:{ lines:[line] } });
  },
  async add(el){ await ACT.setQty(el.dataset.id, 1); },
  async inc(el){
    const line = cartLineFor(el.dataset.id);
    await ACT.setQty(el.dataset.id, (line ? line.qty_requested : 0) + 1);
  },
  async dec(el){
    const line = cartLineFor(el.dataset.id);
    await ACT.setQty(el.dataset.id, (line ? line.qty_requested : 1) - 1);
  },

  async incLine(el){
    const line = cartLines().find(l => l.id === el.dataset.line);
    if (!line) return;
    S.cart = await api("/v1/request-lines/" + line.id, {
      method:"PATCH", body:{ qty_requested: line.qty_requested + 1 } });
  },
  async decLine(el){
    const line = cartLines().find(l => l.id === el.dataset.line);
    if (!line) return;
    if (line.qty_requested <= 1) return ACT.dropCartLine(el);
    S.cart = await api("/v1/request-lines/" + line.id, {
      method:"PATCH", body:{ qty_requested: line.qty_requested - 1 } });
  },
  async dropCartLine(el){
    await api("/v1/request-lines/" + el.dataset.line, { method:"DELETE" });
    await loadCart();
  },

  async checkout(){
    S.creditWall = null; S.adminGate = null;
    const c = S.cart;
    if (!c || !cartLines().length) throw new Error(t("empty_cart"));
    // Rule: the server is told what the screen was showing, and refuses if
    // the two disagree. Sending `price_now` is exactly that — it is the
    // number rendered in the row the pharmacist is looking at.
    const acknowledged = {};
    cartLines().forEach(l => { if (l.price_now) acknowledged[l.id] = l.price_now; });
    const out = await api("/v1/requests/" + c.request_id + "/checkout", {
      method:"POST", headers:{ "Idempotency-Key": "co-" + c.request_id },
      body:{ acknowledged_prices: acknowledged }
    });
    // Over the pharmacy's own limit: nothing was bought, the basket is with
    // the manager, and saying "order placed" here would be a lie the
    // pharmacist would only discover when the medicines did not arrive.
    if (out.awaiting_admin_approval) {
      S.adminGate = { basket_total: out.basket_total, threshold: out.threshold };
      await loadCart();
      return;
    }
    const total = (out.orders || []).map(o => MT(o.goods_total)).join(" + ");
    // Held as one string and rendered through `sentence()` where the flash is
    // drawn: "تم الطلب: 1 طلب · 1 069,00 MT" has words, a count and an amount
    // in one line, which is exactly what an LTR box reorders.
    S.flash = t("order_made") + " " + (out.orders || []).length + " " +
              t("order_count") + " · " + total;
    await loadCart();
    await loadOrders();
    S.tab = "orders";
  },

  /* ---- list ---- */
  async paste(){
    const body = val("paste");
    if (!body.trim()) throw new Error(t("write_a_line"));
    const out = await api("/v1/intake/text", {
      method:"POST", body:{ body: body, channel:"WHATSAPP_TEXT" }
    });
    S.lastRequestId = out.id;
    S.norm = await api("/v1/intake/" + out.id);
    S.scrollTo = "normblock";   // the block lands below the fold otherwise
    clearField("paste");
  },
  async resolve(el){
    await api("/v1/request-lines/" + el.dataset.line + "/resolve", {
      method:"POST", body:{ index_product_id: el.dataset.prod }
    });
    S.norm = await api("/v1/intake/" + S.lastRequestId);
    S.scrollTo = "normblock";
  },
  async dropline(el){
    await api("/v1/request-lines/" + el.dataset.line, { method:"DELETE" });
    S.norm = await api("/v1/intake/" + S.lastRequestId);
    S.scrollTo = "normblock";
  },
  async normdone(){
    // Settling what he meant, and then showing what it costs. Confirming is
    // deliberately NOT done here: SM-01 says a line can only be dropped
    // before `CONFIRM`, so a price screen shown after it would be a dead end
    // for a line nobody can supply — he would be looking at a blocked basket
    // with no way to unblock it. `CONFIRM` is the pharmacist agreeing, and
    // he should be agreeing to a number.
    await api("/v1/requests/" + S.lastRequestId + "/normalization-complete", { method:"POST" });
    S.quote = await api("/v1/requests/" + S.lastRequestId + "/priced");
    S.norm = null;
    S.scrollTo = "quoteblock";
  },
  async quoteCancel(){
    // Back to deciding what the list meant. `REQUEST_CHANGES` is SM-01's own
    // way back from AWAITING_CONFIRMATION, so the request is left where the
    // normalisation screen can edit it rather than stranded one state along.
    const rid = S.quote.request_id;
    if (S.quote.status === "AWAITING_CONFIRMATION")
      await api("/v1/requests/" + rid + "/request-changes", { method:"POST" }).catch(() => {});
    S.quote = null;
    S.norm = await api("/v1/intake/" + rid).catch(() => null);
    S.scrollTo = "normblock";
  },
  async dropQuoteLine(el){
    // Still AWAITING_CONFIRMATION, so a line nobody can supply can still be
    // taken out — which is the whole reason the prices are shown before the
    // confirmation rather than after it.
    await api("/v1/request-lines/" + el.dataset.line, { method:"DELETE" });
    S.quote = await api("/v1/requests/" + S.quote.request_id + "/priced");
    S.scrollTo = "quoteblock";
  },
  async quoteAccept(){
    S.creditWall = null; S.adminGate = null;
    const q = S.quote;
    // The prices on this screen, sent back as the claim — the same
    // mechanism the basket uses, so the server refuses if any of them is
    // not what it is about to bill.
    const acknowledged = {};
    (q.lines || []).forEach(l => { if (l.price_now) acknowledged[l.id] = l.price_now; });
    // His agreement, in one act: the SM-01 CONFIRM and the purchase at the
    // prices on this screen.
    if (q.status === "AWAITING_CONFIRMATION")
      await api("/v1/requests/" + q.request_id + "/confirm", { method:"POST" });
    const out = await api("/v1/requests/" + q.request_id + "/checkout", {
      method:"POST", headers:{ "Idempotency-Key": "co-" + q.request_id },
      body:{ acknowledged_prices: acknowledged }
    });
    if (out.awaiting_admin_approval) {
      S.adminGate = { basket_total: out.basket_total, threshold: out.threshold };
      S.quote = await api("/v1/requests/" + q.request_id + "/priced");
      return;
    }
    const total = (out.orders || []).map(o => MT(o.goods_total)).join(" + ");
    S.flash = t("list_confirmed") + " " + (out.orders || []).length + " " +
              t("order_count") + " · " + total;
    S.quote = null;
    await loadOrders();
    S.tab = "orders";
  },

  /* ---- orders ---- */
  async reloadOrders(){ await loadOrders(); },
  async openReq(el){
    S.order = await api("/v1/requests/" + el.dataset.id);
    // each order in full, for its timeline; one failing only loses its steps
    const full = await Promise.all((S.order.orders || []).map(x =>
      api("/v1/orders/" + x.id).catch(() => null)));
    S.orderFull = {};
    (S.order.orders || []).forEach((x, i) => { if (full[i]) S.orderFull[x.id] = full[i]; });
  },
  async confirmReceipt(el){
    // All or nothing from the app (D-5): every line as the distributor
    // confirmed it. A missing or damaged box is a conversation, in Chat.
    const o = S.orderFull[el.dataset.id];
    if (!o) return;
    await api("/v1/orders/" + o.id + "/receipt", { method:"POST", body:{
      lines: (o.lines || []).map(l => ({ order_line_id: l.id, accepted_qty: l.confirmed_qty, rejected_qty: 0 }))
    }});
    S.flash = t("receipt_done");
    await ACT.openReq({ dataset: { id: S.order.id } });
  },
  async reorder(){
    const o = S.order;
    const all = (o.lines || []).length;
    // Only lines that resolved to a product. A WhatsApp line nobody decided
    // has no product to add, and inventing one would be the app choosing a
    // medicine on his behalf.
    const lines = (o.lines || [])
      .filter(l => l.index_product_id)
      .map(l => ({ index_product_id: l.index_product_id,
                   qty_requested: l.qty_requested }));
    if (!lines.length) throw new Error(t("nothing_to_reorder"));
    // One call, not one per line: this is a single act. Nothing is bought —
    // it goes into the basket and he looks at it, which is the rule for
    // every card on this screen too.
    S.cart = await api("/v1/cart/lines", { method:"POST", body:{ lines: lines } });
    S.order = null;
    S.tab = "cart";
    // Say what happened. Dropping two of nine and reporting "added to your
    // cart" is the app deciding what he meant; the products it could not add
    // are the ones he is most likely to go looking for.
    const missing = (all - lines.length) + ((S.cart.skipped || []).length);
    S.flash = missing
      ? t("reorder_partial").replace("{n}", all - missing).replace("{all}", all)
      : t("reorder_done");
  },
  async backOrders(){ S.order = null; },

  /* ---- chat ---- */
  async send(){
    const body = val("msg").trim();
    if (!body) throw new Error(t("write_message"));
    await api("/v1/support/threads/me/messages", { method:"POST", body:{ body: body, channel:"APP" } });
    clearField("msg");
    await loadThread();
  },
  async escalate(){
    await api("/v1/support/threads/me/escalate", { method:"POST" });
    await loadThread();
  },

  /* ---- account ---- */
  async ask(){
    const q = val("ask").trim();
    if (!q) throw new Error(t("write_question"));
    S.askResult = await api("/v1/assistant/ask", { method:"POST", body:{ question: q } });
  }
};

/* ---------------- events ---------------- */
document.addEventListener("click", function(ev){
  const tabBtn = ev.target.closest && ev.target.closest("[data-tab]");
  if (tabBtn){
    S.tab = tabBtn.dataset.tab;
    S.err = null; S.flash = null; S.order = null; S.product = null;
    render();
    if (S.tab === "cart") guard(loadCart);
    if (S.tab === "store"  && S.filters  === null) guard(loadFilters);
    if (S.tab === "store"  && S.shelves  === null && !S.shelvesLoading) guard(loadShelves);
    if (S.tab === "orders" && S.requests === null) guard(loadOrders);
    if (S.tab === "chat"   && S.thread   === null) guard(loadThread);
    if (S.tab === "panel"  && S.assistant=== null && !S.isReviewer) guard(loadHome);
    if (S.tab === "pending") { S.pendingItem = null; guard(loadPending); }
    return;
  }
  const el = ev.target.closest && ev.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  ev.preventDefault();
  snapshotForm();          // before guard() re-renders and destroys the inputs
  S.flash = null;
  guard(() => fn(el));
});

/* Coming back to the app is the moment to re-read what the server has.

   The sprint asks for it in those words, and in the APK it is the only
   moment that exists: the page is a WebView that is never reloaded, so a
   notice written while the phone was in somebody's pocket, or a basket a
   colleague edited from the back office, would otherwise appear only after
   a cold start. The cart goes with it because the two are the same fact —
   the reminder line at the top of the store is drawn from `GET /v1/cart`.

   Failures are swallowed on purpose: this fires on every tab switch and on
   every unlock, and a red banner because the shop's connection dropped for
   a second is worse than a slightly stale badge. */
/* While the account waits on the review team, ask once a minute whether
   it has been approved — the phone may sit on the counter with the app
   open, and the pharmacist should not have to reopen it to find out. */
setInterval(function(){
  if (!S.token || S.isReviewer || S.busy || document.visibilityState !== "visible") return;
  if (!S.review || S.review.can_checkout) return;
  const was = S.review.pharmacy_status;
  // redraw only on a change: a redraw for nothing would take the caret out
  // of whatever he is typing
  loadReview().then(function(){ if (S.review && S.review.pharmacy_status !== was) render(); }).catch(function(){});
}, 60000);

document.addEventListener("visibilitychange", function(){
  if (document.visibilityState !== "visible" || !S.token) return;
  if (S.isReviewer) {
    Promise.all([loadUnread().catch(() => {}),
                 S.pendingItem ? null : loadPending().catch(() => {})]).then(render);
    return;
  }
  // the review status too: approval happens while the phone is in a pocket.
  // A flash from before he left is stale by now; `loadReview` sets a new one
  // if the account was approved meanwhile.
  S.flash = null;
  Promise.all([loadCart().catch(() => {}), loadUnread().catch(() => {}),
               loadReview().catch(() => {})])
    .then(() => { if (S.tab === "notifs") return loadNotifications().catch(() => {}); })
    .then(render);
});

/* The reject button stays disabled until there is a reason worth reading;
   toggled in place, because a re-render on every keystroke would lose the
   caret. */
document.addEventListener("input", function(ev){
  if (!ev.target || ev.target.id !== "rev_reason") return;
  const b = document.getElementById("rejectbtn");
  if (b) b.disabled = S.busy || ev.target.value.trim().length < 3;
});

document.addEventListener("keydown", function(ev){
  if (ev.key !== "Enter") return;
  const el = ev.target;
  if (!el || el.tagName !== "INPUT") return;
  const act = el.id === "q" ? "search" : el.id === "ask" ? "ask"
            : (el.id === "ph" || el.id === "pw") ? "login" : null;
  if (!act) return;
  ev.preventDefault();
  snapshotForm();
  S.flash = null;
  guard(() => ACT[act](el));
});

/* ---------------- boot ---------------- */
function tick(){
  const c = document.getElementById("clock");
  if (c){
    const d = new Date();
    c.textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }
}
tick(); setInterval(tick, 20000);

applyLang();
render();
if (S.token) guard(afterLogin);
</script>
</body>
</html>
