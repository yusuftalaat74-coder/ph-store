<!DOCTYPE html>
<html lang="pt" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PH Store</title>
<style>
:root{
  --ground:#EFEDE8; --card:#FFFFFF; --ink:#16130F; --muted:#6C6559; --line:#E2DED6;
  --blue:#0A7AFF; --green:#17A34A; --teal:#0FA5A0; --orange:#F08222; --pink:#E8447A;
  --purple:#7B5CF0; --red:#E23B37;
  --r:18px; --pad:16px;
  --hero:linear-gradient(140deg,#25CC80,#0E9070 55%,#0A7C84);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ground);color:var(--ink);
  font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* ---------- chrome ---------- */
.sb{display:flex;justify-content:space-between;align-items:center;
    padding:10px var(--pad) 4px;font-size:13px;font-weight:700;flex:0 0 auto}
.sb .brand{letter-spacing:.2px}
.main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 var(--pad) 24px;
      -webkit-overflow-scrolling:touch}
h1{font-size:30px;line-height:1.1;margin:6px 0 2px;letter-spacing:-.6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}

.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);
        background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
        padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
               padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
.tabbar button.on{color:var(--green)}
.tabbar .ic{width:22px;height:22px;display:block}
.tabbar button:active{background:rgba(0,0,0,.05)}

/* ---------- blocks ---------- */
.card{background:var(--card);border-radius:var(--r);padding:var(--pad);margin-bottom:12px;
      box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hero{background:var(--hero);color:#fff;border-radius:var(--r);padding:20px var(--pad);
      margin-bottom:14px}
.hero .k{font-size:13px;opacity:.9;font-weight:600}
.hero .v{font-size:32px;font-weight:800;letter-spacing:-1px;margin:2px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row+.row{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.t{font-weight:700}
.s{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.g{background:rgba(23,163,74,.12);color:var(--green)}
.pill.o{background:rgba(240,130,34,.14);color:#B45F10}
.pill.b{background:rgba(10,122,255,.12);color:var(--blue)}
.pill.r{background:rgba(226,59,55,.12);color:var(--red)}
.pill.m{background:rgba(108,101,89,.12);color:var(--muted)}

.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--ink);color:#fff;
     font-weight:700;text-align:center}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.4}
.btn.g{background:var(--green)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:9px 14px;width:auto;font-size:13px;border-radius:11px;display:inline-block}

input[type=text],input[type=password],input[type=number],input[type=search],textarea,select{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;
  background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--green)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
textarea{min-height:120px;resize:vertical}

.err{background:rgba(226,59,55,.1);color:#9B1D1A;border-radius:12px;padding:12px;
     font-size:13px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.ok{background:rgba(23,163,74,.1);color:#0C6B31;border-radius:12px;padding:12px;
    font-size:13px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);
      border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;
      vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:10px;background:var(--ground);
            font-weight:800;font-size:17px;line-height:1}
.qty span{min-width:26px;text-align:center;font-weight:700}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}
.msg .w{display:block;font-size:11px;opacity:.75;margin-bottom:2px;font-weight:700}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.composer textarea{min-height:44px;max-height:120px}

.chip{display:inline-block;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);
      background:#fff;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.chip.on{border-color:var(--green);background:rgba(23,163,74,.08);color:#0C6B31}
code{background:rgba(0,0,0,.05);padding:1px 5px;border-radius:5px;font-size:12px;
     font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>

<div class="sb"><span id="clock">—</span><span class="brand">PH Store</span></div>
<div class="main" id="main"></div>

<nav class="tabbar" id="tabbar"></nav>

<script>
"use strict";
/* ===================================================================
   PH Store — the pharmacy client.

   Every screen below is backed by a real call to the PH Store API. There
   is no sample data in this file: if the server is unreachable the screen
   says so, in place, instead of rendering a number that came from nowhere.

   Three rules this file keeps:

   1. Money is never parsed into a JS number. The API sends 2dp strings
      (A2.4) and they are displayed as strings. A float here would quietly
      lose a metical over enough additions — the exact defect the backend
      was fixed for.
   2. A line the matcher did not resolve is never auto-picked. `ASK` lines
      render their candidates and wait; `UNRESOLVED` lines offer a search.
      This mirrors the server guard rather than working around it.
   3. Every render is wrapped. A thrown error paints the error into the
      screen instead of killing the handler — an earlier build of this app
      died on one null reference and every later tap silently did nothing,
      which looked exactly like "the app is just an image".
   =================================================================== */

/* ---------------- storage (never required) ---------------- */
const mem = {};
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v === null ? mem[k] : v; }
          catch(e){ return mem[k]; } },
  set(k,v){ mem[k] = v; try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------------- config ---------------- */
// Served from the API itself (http://host:8099/app) the API is this same
// origin, so there is nothing for the pharmacist to type. Loaded from
// file:///android_asset/ inside the APK there is no origin to borrow, so the
// Servidor field decides and this local default is only a first guess.
const DEFAULT_API = (location.protocol === "http:" || location.protocol === "https:")
  ? location.origin
  : "http://127.0.0.1:8099";
function apiBase(){ return (store.get("api") || DEFAULT_API).replace(/\/+$/,""); }

/* ---------------- state ---------------- */
const S = {
  tab: "home",
  token: store.get("token") || null,
  me: null,
  busy: false,
  err: null,
  flash: null,
  cart: [],            // [{product, qty}]
  search: "",
  results: null,
  requests: null,
  order: null,
  norm: null,          // normalisation view for a pasted list
  thread: null,
  assistant: null,
  lastRequestId: null
};

/* ---------------- api ---------------- */
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body !== undefined && !(opts.body instanceof FormData))
    headers["Content-Type"] = "application/json";
  if (S.token) headers["Authorization"] = "Bearer " + S.token;

  let res;
  try {
    res = await fetch(apiBase() + path, {
      method: opts.method || "GET",
      headers,
      body: opts.body === undefined ? undefined
            : (opts.body instanceof FormData ? opts.body : JSON.stringify(opts.body))
    });
  } catch (e) {
    throw new Error("Sem ligação ao servidor.\n" + apiBase() + "\n\n" + e.message);
  }

  if (res.status === 204) return null;
  const txt = await res.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch(e){ data = { raw: txt }; }

  if (!res.ok){
    if (res.status === 401){ S.token = null; S.me = null; store.del("token"); }
    const err = (data && data.error) || {};
    const detail = (err.details || []).map(d => "· " + d.field + ": " + d.reason).join("\n");
    const e = new Error([err.message || ("HTTP " + res.status), detail].filter(Boolean).join("\n"));
    e.code = err.code; e.status = res.status; e.rule = err.rule;
    throw e;
  }
  return data;
}

/* ---------------- helpers ---------------- */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// money stays a string, start to finish
function MT(v){
  if (v === null || v === undefined) return "—";
  const s = String(v);
  const [i, d] = s.split(".");
  const grouped = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return grouped + "," + (d || "00") + " MT";
}
function productName(p){
  return [p.inn, p.strength, p.form].filter(Boolean).join(" · ")
       + (p.pack_size ? " (" + p.pack_size + ")" : "");
}
const STATUS_PT = {
  DRAFT:"Rascunho", NORMALIZING:"A ler a lista", AWAITING_CONFIRMATION:"A confirmar",
  AWAITING_ADMIN_APPROVAL:"A aguardar aprovação", CONFIRMED:"Confirmado",
  IN_FULFILMENT:"Em execução", CLOSED:"Fechado", CANCELLED:"Cancelado",
  PENDING_ACCEPTANCE:"A aguardar fornecedor", ACCEPTED:"Aceite", DISPATCHED:"A caminho",
  DELIVERED_PENDING_RECEIPT:"Entregue — a conferir", RECEIPT_ACCEPTED:"Conferido",
  DISPUTED:"Em disputa", REJECTED:"Recusado", RETURN_IN_PROGRESS:"Devolução em curso"
};
const statusPill = st => {
  const cls = ({CLOSED:"m", CANCELLED:"m", REJECTED:"r", DISPUTED:"r",
                CONFIRMED:"g", ACCEPTED:"g", RECEIPT_ACCEPTED:"g",
                DISPATCHED:"b", IN_FULFILMENT:"b"})[st] || "o";
  return '<span class="pill ' + cls + '">' + esc(STATUS_PT[st] || st) + "</span>";
};

/* ---------------- forms ----------------
   Every action runs through `guard`, and `guard` re-renders immediately to
   show the spinner. That rebuilds `#main`, which destroys the very inputs the
   action is about to read — so a login handler read two empty strings and the
   server answered 401 with correct credentials typed in front of you.

   Caught by the live end-to-end drive, not by reading the code. The fix is to
   snapshot the form the moment the tap happens, before anything re-renders,
   and have actions read the snapshot. `restoreForm` then puts the text back
   after a render so nothing the user typed is lost mid-request. */
S.form = {};

function snapshotForm(){
  const f = {};
  document.querySelectorAll("#main input, #main textarea, #main select")
    .forEach(el => { if (el.id) f[el.id] = el.value; });
  S.form = f;
}
function restoreForm(){
  document.querySelectorAll("#main input, #main textarea, #main select")
    .forEach(el => {
      if (el.id && S.form[el.id] !== undefined && !el.value) el.value = S.form[el.id];
    });
}
function val(id){
  if (S.form[id] !== undefined) return S.form[id];
  const el = document.getElementById(id);
  return el ? el.value : "";
}
function clearField(id){
  S.form[id] = "";
  const el = document.getElementById(id);
  if (el) el.value = "";
}

/* ---------------- render ---------------- */
function setBusy(v){ S.busy = v; render(); }

async function guard(fn){
  S.err = null;
  setBusy(true);
  try { await fn(); }
  catch (e) { S.err = e.message || String(e); }
  finally { setBusy(false); }
}

const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/>',
  catalogue:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/>',
  orders:'<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  chat:'<path d="M21 12a8 8 0 1 1-3.2-6.4"/><path d="M21 4v5h-5"/>',
  panel:'<path d="M4 20V10M10 20V4M16 20v-7M22 20v-4"/>'
};
const TABS = [
  ["home","Início"], ["catalogue","Catálogo"], ["orders","Pedidos"],
  ["chat","Conversa"], ["panel","Painel"]
];

function renderTabs(){
  const bar = document.getElementById("tabbar");
  if (!bar) return;
  if (!S.token){ bar.style.display = "none"; return; }
  bar.style.display = "flex";
  bar.innerHTML = TABS.map(([id,label]) =>
    '<button data-tab="' + id + '" class="' + (S.tab === id ? "on" : "") + '">' +
      '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ICONS[id] + "</svg>" +
      "<span>" + label + "</span></button>"
  ).join("");
}

function render(){
  const main = document.getElementById("main");
  if (!main) return;
  try {
    main.innerHTML =
      (S.err   ? '<div class="err">'  + esc(S.err)   + "</div>" : "") +
      (S.flash ? '<div class="ok">'   + esc(S.flash) + "</div>" : "") +
      (S.token ? VIEW[S.tab]() : loginView());
  } catch (e) {
    // rule 3: a broken screen still shows why, and the app stays alive
    main.innerHTML = '<div class="err">Erro ao desenhar o ecrã:\n' + esc(e.message) + "</div>";
  }
  restoreForm();
  renderTabs();
  if (S.scrollTo){
    const target = document.getElementById(S.scrollTo);
    S.scrollTo = null;
    if (target) target.scrollIntoView({ behavior:"smooth", block:"start" });
  }
}

/* ---------------- login ---------------- */
function loginView(){
  return '' +
  '<h1>PH Store</h1>' +
  '<p class="sub">Entrar na sua farmácia</p>' +
  '<div class="card">' +
    '<label for="ph">Telemóvel</label>' +
    '<input id="ph" type="text" inputmode="tel" placeholder="+258 84 000 0011" ' +
      'value="' + esc(store.get("lastPhone") || "") + '">' +
    '<label for="pw">Palavra-passe</label>' +
    '<input id="pw" type="password" placeholder="••••••••">' +
    '<div style="height:16px"></div>' +
    '<button class="btn g" data-act="login"' + (S.busy ? " disabled" : "") + '>' +
      (S.busy ? '<span class="spin"></span>' : "Entrar") + "</button>" +
  "</div>" +
  '<div class="card">' +
    '<label for="api">Servidor</label>' +
    '<input id="api" type="text" value="' + esc(apiBase()) + '">' +
    '<p class="s" style="margin:8px 0 0">O endereço da API. Mude apenas se a sua equipa lho pediu.</p>' +
    '<div style="height:12px"></div>' +
    '<button class="btn ghost sm" data-act="saveApi">Guardar servidor</button> ' +
    '<button class="btn ghost sm" data-act="ping">Testar ligação</button>' +
  "</div>";
}

/* ---------------- home ---------------- */
function homeView(){
  const a = S.assistant;
  return '' +
  "<h1>Olá</h1>" +
  '<p class="sub">' + esc(S.me ? (S.me.roles || []).join(" · ") : "") + "</p>" +
  '<div class="hero">' +
    '<div class="k">Em dívida aos fornecedores</div>' +
    '<div class="v">' + (a ? esc(MT(a.outstanding_to_vendors)) : "—") + "</div>" +
    '<div class="k">' + (a ? esc(a.open_orders + " pedido(s) em curso") : "a carregar…") + "</div>" +
  "</div>" +
  (a ? '<div class="card">' +
      '<div class="row"><span class="t">Pedidos abertos</span><span>' + a.open_requests + "</span></div>" +
      '<div class="row"><span class="t">Encomendas em curso</span><span>' + a.open_orders + "</span></div>" +
      '<div class="row"><span class="t">Disputas</span><span>' + a.open_disputes + "</span></div>" +
      '<div class="row"><span class="t">Devoluções</span><span>' + a.open_returns + "</span></div>" +
      '<p class="s" style="margin:12px 0 0">Calculado de: ' + esc(a.basis.source) + "</p>" +
    "</div>"
   : '<div class="card empty">' + (S.busy ? '<span class="spin"></span>' : "Sem dados") + "</div>") +
  '<div class="card">' +
    '<span class="t">Enviar uma lista</span>' +
    '<p class="s">Cole a lista como a escreve no WhatsApp — um produto por linha.</p>' +
    '<textarea id="paste" placeholder="Amoxicilina 500 mg 21&#10;Paracetamol 500&#10;..."></textarea>' +
    '<div style="height:10px"></div>' +
    '<button class="btn" data-act="paste"' + (S.busy ? " disabled" : "") + ">Enviar lista</button>" +
  "</div>" +
  (S.norm ? normBlock() : "");
}

function normBlock(){
  const n = S.norm;
  const lines = n.lines.map(l => {
    if (l.match_status === "AUTO" || l.match_status === "RESOLVED")
      return '<div class="row"><span><span class="t">' + esc(l.source_span || "") + "</span>" +
             '<br><span class="s">Identificado</span></span>' +
             '<span class="pill g">OK</span></div>';
    const cands = (l.candidates || []).map(c =>
      '<button class="chip" data-act="resolve" data-line="' + esc(l.id) + '" data-prod="' + esc(c.id) + '">' +
      esc(productName(c)) + "</button>").join("");
    return '<div class="row" style="display:block">' +
      '<div class="row" style="margin:0;padding:0;border:0">' +
        '<span class="t">' + esc(l.source_span || "") + "</span>" +
        '<span class="pill ' + (l.match_status === "ASK" ? "o" : "r") + '">' +
        (l.match_status === "ASK" ? "Confirmar" : "Não encontrado") + "</span>" +
      "</div>" +
      '<p class="s" style="margin:6px 0">' +
        (cands ? "Qual destes?" : "Nada no índice corresponde a esta linha.") + "</p>" +
      cands +
      '<button class="chip" data-act="dropline" data-line="' + esc(l.id) + '">Remover linha</button>' +
    "</div>";
  }).join("");

  return '<div class="card" id="normblock">' +
    '<div class="row" style="margin:0;padding:0;border:0">' +
      '<span class="t">' + esc(n.request.number) + "</span>" + statusPill(n.request.status) +
    "</div>" +
    '<p class="s">Nada avança enquanto uma linha estiver por decidir.</p>' +
    lines +
    '<div style="height:12px"></div>' +
    (n.can_complete_normalisation
      ? '<button class="btn g" data-act="normdone">Confirmar lista</button>'
      : '<button class="btn" disabled>' + n.blocking_line_ids.length + " linha(s) por decidir</button>") +
  "</div>";
}

/* ---------------- catalogue ---------------- */
function catalogueView(){
  const cartCount = S.cart.reduce((n,i) => n + i.qty, 0);
  const results = S.results;
  return '' +
  "<h1>Catálogo</h1>" +
  '<p class="sub">' + (cartCount ? cartCount + " item(ns) no carrinho" : "Procure por nome ou substância") + "</p>" +
  '<div class="card">' +
    '<input id="q" type="search" placeholder="Paracetamol…" value="' + esc(S.search) + '">' +
    '<div style="height:10px"></div>' +
    '<button class="btn" data-act="search"' + (S.busy ? " disabled" : "") + ">" +
      (S.busy ? '<span class="spin"></span>' : "Procurar") + "</button>" +
  "</div>" +
  (results === null ? ""
   : results.length === 0 ? '<div class="card empty">Nada encontrado.</div>'
   : results.map(p => {
      const inCart = S.cart.find(i => i.product.id === p.id);
      return '<div class="card">' +
        '<div class="row" style="margin:0;padding:0;border:0">' +
          '<span><span class="t">' + esc(productName(p)) + "</span><br>" +
          '<span class="s">' + (p.fresh_offer_count || 0) + " oferta(s)" +
          (p.regulated_price ? " · preço regulado" : "") + "</span></span>" +
        "</div>" +
        '<div style="height:10px"></div>' +
        (inCart
          ? '<div class="qty">' +
              '<button data-act="dec" data-id="' + esc(p.id) + '">−</button>' +
              "<span>" + inCart.qty + "</span>" +
              '<button data-act="inc" data-id="' + esc(p.id) + '">+</button>' +
            "</div>"
          : '<button class="btn ghost sm" data-act="add" data-id="' + esc(p.id) + '">Adicionar</button>') +
      "</div>";
   }).join("")) +
  (S.cart.length ? '<div class="card">' +
      '<span class="t">Carrinho</span>' +
      S.cart.map(i => '<div class="row"><span class="s">' + esc(productName(i.product)) +
        "</span><span>" + i.qty + "</span></div>").join("") +
      '<div style="height:12px"></div>' +
      '<button class="btn g" data-act="checkout"' + (S.busy ? " disabled" : "") + ">" +
        (S.busy ? '<span class="spin"></span>' : "Fazer pedido") + "</button>" +
    "</div>" : "");
}

/* ---------------- orders ---------------- */
function ordersView(){
  if (S.order) return orderDetail();
  const rs = S.requests;
  return '' +
  "<h1>Pedidos</h1>" +
  '<p class="sub">Os seus pedidos, do mais recente</p>' +
  '<button class="btn ghost sm" data-act="reloadOrders">Actualizar</button>' +
  '<div style="height:12px"></div>' +
  (rs === null ? '<div class="card empty">' + (S.busy ? '<span class="spin"></span>' : "—") + "</div>"
   : rs.length === 0 ? '<div class="card empty">Ainda sem pedidos.</div>'
   : rs.map(r => '<div class="card" data-act="openReq" data-id="' + esc(r.id) + '">' +
        '<div class="row" style="margin:0;padding:0;border:0">' +
          '<span><span class="t">' + esc(r.number) + "</span><br>" +
          '<span class="s">' + esc(r.channel) + " · " + (r.line_count || 0) + " linha(s)</span></span>" +
          statusPill(r.status) +
        "</div>" +
      "</div>").join(""));
}

function orderDetail(){
  const o = S.order;
  const orders = o.orders || [];
  return '' +
  '<button class="btn ghost sm" data-act="backOrders">← Voltar</button>' +
  '<div style="height:12px"></div>' +
  "<h1>" + esc(o.number) + "</h1>" +
  '<p class="sub">' + esc(STATUS_PT[o.status] || o.status) + "</p>" +
  '<div class="card">' +
    '<span class="t">Linhas</span>' +
    (o.lines || []).map(l => '<div class="row"><span class="s">' +
      esc(l.source_span || l.index_product_id || "—") + "</span><span>" +
      l.qty_requested + "</span></div>").join("") +
  "</div>" +
  (orders.length ? orders.map(x => '<div class="card">' +
      '<div class="row" style="margin:0;padding:0;border:0">' +
        '<span class="t">' + esc(x.number || x.id) + "</span>" + statusPill(x.status) +
      "</div>" +
      '<div class="row"><span class="s">Mercadoria</span><span class="t">' +
        esc(MT(x.goods_total)) + "</span></div>" +
    "</div>").join("")
   : '<div class="card empty">Sem encomendas geradas.</div>');
}

/* ---------------- chat ---------------- */
function chatView(){
  const t = S.thread;
  return '' +
  "<h1>Conversa</h1>" +
  '<p class="sub">' +
    (t ? (t.active_handler === "HUMAN" ? "Está a falar com um colega"
        : t.active_handler === "ESCALATING" ? "A passar para um colega…"
        : "Assistente automático") : "a carregar…") + "</p>" +
  (t ? '<div class="card">' +
      '<div class="msgs">' +
        (t.messages.length ? t.messages.map(m =>
          '<div class="msg ' + (m.sender_type === "PHARMACY" ? "me" : "them") + '">' +
            '<span class="w">' + esc(m.sender_type === "PHARMACY" ? "Você" :
                                     m.sender_type === "AGENT" ? "PH Store" : "Sistema") + "</span>" +
            esc(m.body) + "</div>").join("")
         : '<div class="empty">Sem mensagens ainda.</div>') +
      "</div>" +
      '<div class="composer">' +
        '<textarea id="msg" placeholder="Escreva aqui…"></textarea>' +
        '<button class="btn sm g" data-act="send">Enviar</button>' +
      "</div>" +
      (t.active_handler === "BOT"
        ? '<div style="height:10px"></div>' +
          '<button class="btn ghost sm" data-act="escalate">Falar com uma pessoa</button>' : "") +
    "</div>"
   : '<div class="card empty">' + (S.busy ? '<span class="spin"></span>' : "—") + "</div>");
}

/* ---------------- panel ---------------- */
function panelView(){
  const a = S.assistant;
  return '' +
  "<h1>Painel</h1>" +
  '<p class="sub">Sobre a sua farmácia</p>' +
  '<div class="card">' +
    '<span class="t">Pergunte</span>' +
    '<p class="s">Ex.: «quando vou ficar sem stock?»</p>' +
    '<input id="ask" type="text" placeholder="A sua pergunta…">' +
    '<div style="height:10px"></div>' +
    '<button class="btn" data-act="ask"' + (S.busy ? " disabled" : "") + ">Perguntar</button>" +
    (S.askResult ? '<div style="height:12px"></div>' +
      '<p class="s">Respondido por: <code>' + esc(S.askResult.answered_by || "—") + "</code></p>" +
      (S.askResult.message_pt ? '<p class="s">' + esc(S.askResult.message_pt) + "</p>" : "") : "") +
  "</div>" +
  (a ? '<div class="card">' +
      '<span class="t">Resumo</span>' +
      '<div class="row"><span class="s">Em dívida</span><span class="t">' +
        esc(MT(a.outstanding_to_vendors)) + "</span></div>" +
      '<div class="row"><span class="s">Pedidos abertos</span><span>' + a.open_requests + "</span></div>" +
    "</div>" : "") +
  '<div class="card">' +
    '<span class="t">Sessão</span>' +
    '<p class="s">' + esc(S.me ? S.me.user_id : "") + "<br>" + esc(apiBase()) + "</p>" +
    '<div style="height:10px"></div>' +
    '<button class="btn ghost" data-act="logout">Sair</button>' +
  "</div>";
}

const VIEW = { home:homeView, catalogue:catalogueView, orders:ordersView, chat:chatView, panel:panelView };

/* ---------------- loaders ---------------- */
async function loadHome(){
  S.assistant = await api("/v1/assistant/summary");
}
async function loadOrders(){
  const r = await api("/v1/requests?limit=50");
  S.requests = r.items;
}
async function loadThread(){
  S.thread = await api("/v1/support/threads/me");
}
async function afterLogin(){
  S.me = await api("/v1/auth/me");
  await loadHome();
}

/* ---------------- actions ---------------- */
const ACT = {
  async login(){
    const phone = val("ph");
    const pw = val("pw");
    const apiVal = val("api");
    if (apiVal) store.set("api", apiVal.trim());
    const out = await api("/v1/auth/login", {
      method:"POST", body:{ phone: phone.trim(), password: pw, surface:"PH" }
    });
    S.token = out.access_token;
    store.set("token", S.token);
    store.set("lastPhone", phone.trim());
    await afterLogin();
    S.tab = "home";
  },
  async saveApi(){
    const v = val("api").trim();
    if (v) store.set("api", v);
    S.flash = "Servidor guardado.";
  },
  async ping(){
    const r = await fetch(apiBase() + "/healthz");
    const j = await r.json();
    S.flash = "Servidor OK · " + (j.status || "?");
  },
  async logout(){
    S.token = null; S.me = null; store.del("token");
    S.cart = []; S.results = null; S.requests = null; S.thread = null;
    S.assistant = null; S.norm = null; S.order = null; S.form = {};
  },

  async paste(){
    const body = val("paste");
    if (!body.trim()) throw new Error("Escreva pelo menos uma linha.");
    const out = await api("/v1/intake/text", {
      method:"POST", body:{ body: body, channel:"WHATSAPP_TEXT" }
    });
    S.lastRequestId = out.id;
    S.norm = await api("/v1/intake/" + out.id);
    S.scrollTo = "normblock";   // the block lands below the fold otherwise
    clearField("paste");
  },
  async resolve(el){
    await api("/v1/request-lines/" + el.dataset.line + "/resolve", {
      method:"POST", body:{ index_product_id: el.dataset.prod }
    });
    S.norm = await api("/v1/intake/" + S.lastRequestId);
    S.scrollTo = "normblock";
  },
  async dropline(el){
    await api("/v1/request-lines/" + el.dataset.line, { method:"DELETE" });
    S.norm = await api("/v1/intake/" + S.lastRequestId);
    S.scrollTo = "normblock";
  },
  async normdone(){
    await api("/v1/requests/" + S.lastRequestId + "/normalization-complete", { method:"POST" });
    await api("/v1/requests/" + S.lastRequestId + "/confirm", { method:"POST" });
    S.flash = "Lista confirmada.";
    S.norm = null;
    await loadOrders();
    S.tab = "orders";
  },

  async search(){
    S.search = val("q");
    if (!S.search.trim()){ S.results = []; return; }
    const out = await api("/v1/catalogue/search?q=" + encodeURIComponent(S.search.trim()));
    S.results = out.items;
  },
  async add(el){
    const p = (S.results || []).find(x => x.id === el.dataset.id);
    if (p) S.cart.push({ product: p, qty: 1 });
  },
  async inc(el){
    const i = S.cart.find(x => x.product.id === el.dataset.id);
    if (i) i.qty += 1;
  },
  async dec(el){
    const i = S.cart.find(x => x.product.id === el.dataset.id);
    if (!i) return;
    i.qty -= 1;
    if (i.qty <= 0) S.cart = S.cart.filter(x => x !== i);
  },
  async checkout(){
    if (!S.cart.length) throw new Error("O carrinho está vazio.");
    const req = await api("/v1/requests", {
      method:"POST", body:{ mode:"CATALOGUE", allocation_strategy:"FEWEST_VENDORS" }
    });
    for (const item of S.cart){
      await api("/v1/requests/" + req.id + "/lines", {
        method:"POST", body:{ index_product_id: item.product.id, qty_requested: item.qty }
      });
    }
    // the key is tied to this basket, so a retry replays instead of duplicating
    const key = "co-" + req.id;
    const out = await api("/v1/requests/" + req.id + "/checkout", {
      method:"POST", headers:{ "Idempotency-Key": key }, body:{}
    });
    const total = (out.orders || []).map(o => MT(o.goods_total)).join(" + ");
    S.flash = "Pedido criado: " + (out.orders || []).length + " encomenda(s) · " + total;
    S.cart = [];
    await loadOrders();
    S.tab = "orders";
  },

  async reloadOrders(){ await loadOrders(); },
  async openReq(el){ S.order = await api("/v1/requests/" + el.dataset.id); },
  async backOrders(){ S.order = null; },

  async send(){
    const body = val("msg").trim();
    if (!body) throw new Error("Escreva uma mensagem.");
    await api("/v1/support/threads/me/messages", { method:"POST", body:{ body: body, channel:"APP" } });
    clearField("msg");
    await loadThread();
  },
  async escalate(){
    await api("/v1/support/threads/me/escalate", { method:"POST" });
    await loadThread();
  },

  async ask(){
    const q = val("ask").trim();
    if (!q) throw new Error("Escreva uma pergunta.");
    S.askResult = await api("/v1/assistant/ask", { method:"POST", body:{ question: q } });
  }
};

/* ---------------- events ---------------- */
document.addEventListener("click", function(ev){
  const tabBtn = ev.target.closest && ev.target.closest("[data-tab]");
  if (tabBtn){
    S.tab = tabBtn.dataset.tab;
    S.err = null; S.flash = null; S.order = null;
    render();
    if (S.tab === "orders" && S.requests === null) guard(loadOrders);
    if (S.tab === "chat"   && S.thread   === null) guard(loadThread);
    if ((S.tab === "home" || S.tab === "panel") && S.assistant === null) guard(loadHome);
    return;
  }
  const el = ev.target.closest && ev.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  ev.preventDefault();
  snapshotForm();          // before guard() re-renders and destroys the inputs
  S.flash = null;
  guard(() => fn(el));
});

/* ---------------- boot ---------------- */
function tick(){
  const c = document.getElementById("clock");
  if (c){
    const d = new Date();
    c.textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }
}
tick(); setInterval(tick, 20000);

render();
if (S.token) guard(afterLogin);
</script>
</body>
</html>
